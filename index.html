<style>
/* Giao diện 16:9. Cỡ chữ/nút theo --u (1% chiều rộng khung game) */
:root{
  --ink:#2a1a10;--paper:#fff6e4;--paper2:#f3e2c0;--leaf:#3f8f45;--leafd:#245c2c;
  --clay:#c8462e;--gold:#f0b429;--goldd:#b8841c;--wood:#6b4423;--cream:#fffaf2;
  --shadow:0 3px 0 #1a100888,0 8px 18px #0004;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:
  radial-gradient(1200px 500px at 50% 0%,#1d3a28 0%,#0b140f 55%,#07100c 100%);
  overflow:hidden;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);touch-action:manipulation}
body{display:grid;place-items:center}
#game{
  --u:calc(min(100vw,100vh*16/9)/100);
  position:relative;width:calc(var(--u)*100);height:calc(var(--u)*56.25);
  min-width:320px;min-height:180px;font-size:calc(var(--u)*1.9);
  background:#16301c;border-radius:calc(var(--u)*1.4);overflow:hidden;
  box-shadow:0 0 0 3px #3a2412,0 0 0 6px #e8d7b0,0 18px 40px #000a;
}
@supports(height:100dvh){#game{--u:calc(min(100vw,100dvh*16/9)/100)}}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated}
#tx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;image-rendering:auto}
body.fp #bar{display:none}
button,input,select,textarea{font-family:inherit}
.ic{width:calc(var(--u)*3);height:calc(var(--u)*3);image-rendering:pixelated;vertical-align:middle;flex:none}
[data-ic]{display:inline-flex}
#hud{
  position:absolute;top:calc(var(--u)*1.1);left:calc(var(--u)*1.1);right:calc(var(--u)*11.2);
  display:flex;gap:calc(var(--u)*.6);pointer-events:none;align-items:flex-start;z-index:2;
}
#hud .left{display:flex;gap:calc(var(--u)*.5);align-items:center;flex-wrap:wrap}
.stat{
  display:inline-flex;align-items:center;gap:calc(var(--u)*.35);
  background:linear-gradient(#fffaf2,#f4e4c4);
  border:2px solid var(--ink);border-radius:999px;
  box-shadow:0 2px 0 #1a100866;
  padding:calc(var(--u)*.28) calc(var(--u)*.9) calc(var(--u)*.28) calc(var(--u)*.4);
  font-weight:800;color:var(--ink);font-size:calc(var(--u)*1.7);line-height:1;
}
.stat .ic{width:calc(var(--u)*2.5);height:calc(var(--u)*2.5)}
.stat b{font-weight:800}
.zonepill{
  margin-left:auto;display:inline-flex;align-items:center;gap:calc(var(--u)*.4);
  background:#2a1a10e8;color:#fff6e4;border:2px solid #f0b429;
  border-radius:999px;padding:calc(var(--u)*.35) calc(var(--u)*1.1);
  font-weight:800;font-size:calc(var(--u)*1.55);letter-spacing:.02em;
  box-shadow:0 2px 0 #0008;
}
#bagbtn{
  position:static;flex:0 0 auto;pointer-events:auto;
  width:calc(var(--u)*6.6);height:calc(var(--u)*6.6);
  min-width:calc(var(--u)*6.6);padding:0;margin:0 0 0 calc(var(--u)*.4);
  display:flex;align-items:center;justify-content:center;
  border-radius:calc(var(--u)*1.4);
  background:linear-gradient(#5cb356,#3b8a40);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--leafd);
  color:#fff;
}
#bagbtn .ic{width:calc(var(--u)*3.6);height:calc(var(--u)*3.6)}
#bagbtn:active{transform:translateY(2px);box-shadow:none}
.chip{display:flex;align-items:center;gap:calc(var(--u)*.6);background:var(--paper);border:2px solid var(--ink);box-shadow:0 2px 0 #0006;padding:calc(var(--u)*.4) calc(var(--u)*1);font:600 calc(var(--u)*1.9) "Be Vietnam Pro",sans-serif;color:var(--ink);cursor:pointer;position:relative}
.bd{position:absolute;top:calc(var(--u)*-.55);right:calc(var(--u)*-.55);background:var(--clay);color:#fff;border:2px solid var(--ink);border-radius:99px;min-width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);line-height:calc(var(--u)*2);text-align:center;font-size:calc(var(--u)*1.35);font-weight:800;padding:0 4px}
.bd:empty{display:none}
#bar{
  position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;

}

  display:flex;align-items:flex-end;gap:calc(var(--u)*.35);

  padding:calc(var(--u)*.4) calc(var(--u)*.5) calc(var(--u)*.45);
  box-shadow:0 4px 0 #2a160c,0 10px 18px #0005;
}
#tool{display:flex;gap:calc(var(--u)*.35);pointer-events:auto;justify-content:center;align-items:center}
#tool .chip{
  position:relative;
  width:calc(var(--u)*6.2);height:calc(var(--u)*6.2);
  min-width:calc(var(--u)*6.2);max-width:calc(var(--u)*6.2);
  padding:calc(var(--u)*.15);margin:0;box-sizing:border-box;
  font-size:calc(var(--u)*1.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;flex:0 0 auto;white-space:nowrap;
  border-radius:calc(var(--u)*1.05);

}
#tool .chip .ic{width:calc(var(--u)*2.7);height:calc(var(--u)*2.7);flex:none}
#tool .chip .slotn{position:absolute;top:2px;left:4px;font-size:calc(var(--u)*1);opacity:.55;font-weight:800;line-height:1;color:#6b4423}
#tool .chip .qty{position:absolute;right:3px;bottom:1px;font-size:calc(var(--u)*1.15);line-height:1;font-weight:800;color:#2a1a10;text-shadow:0 1px 0 #fff8}
#tool .chip.empty{opacity:1;background:repeating-linear-gradient(135deg,#d8c49a 0 6px,#cbb58a 6px 12px);box-shadow:inset 0 0 0 1px #0002}
#tool .chip.empty .slotn{opacity:.7}
#tool .chip.sel{
  background:linear-gradient(#ffe9a8,#f0b429);color:#2a1a10;opacity:1;
  border-color:#2a1a10;
  box-shadow:0 0 0 2px #fff6,0 3px 0 #8a6414;
  transform:translateY(calc(var(--u)*-.25));
}
#tool .chip.sel .ic{opacity:1;filter:none}
#tool .chip.sel .slotn{opacity:1;color:#6b3a10}
#tools{position:absolute;top:calc(var(--u)*1.1);right:calc(var(--u)*1.1);z-index:4;display:flex;gap:calc(var(--u)*.7);pointer-events:none}
.tbtn{position:relative;pointer-events:auto;width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);padding:0;display:flex;align-items:center;justify-content:center;border-radius:calc(var(--u)*1.3);background:linear-gradient(#fffaf2,#f0dcb0);border:2px solid var(--ink);box-shadow:0 3px 0 #8a6a40}
.tbtn:active{transform:translateY(2px);box-shadow:none}
.tbtn .ic{width:calc(var(--u)*2.8);height:calc(var(--u)*2.8)}
.qdot{display:inline-flex;align-items:center;justify-content:center;min-width:calc(var(--u)*2);height:calc(var(--u)*2);padding:0 calc(var(--u)*.4);border-radius:999px;background:#c8462e;color:#fff;border:2px solid var(--ink);font-size:calc(var(--u)*1.2);font-weight:800;font-style:normal}
.tbtn .qdot{position:absolute;top:calc(var(--u)*-.8);right:calc(var(--u)*-.8)}
.qtabs{display:flex;gap:calc(var(--u)*.6);margin-bottom:calc(var(--u)*1)}
.qtab{flex:1;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.6);padding:calc(var(--u)*.9) calc(var(--u)*1);border:2px solid var(--ink);border-radius:calc(var(--u)*1.1);background:#f4e4c4;color:var(--ink);font-size:calc(var(--u)*1.7);font-weight:800;box-shadow:0 2px 0 #8a6a40}
.qtab.on{background:#3b8a40;color:#fff}
.qsec{margin:calc(var(--u)*1.2) 0 calc(var(--u)*.6);font-size:calc(var(--u)*1.6);font-weight:800;color:var(--ink)}
.qrow{display:flex;flex-direction:column;gap:calc(var(--u)*.4);padding:calc(var(--u)*1) calc(var(--u)*1.2);margin-bottom:calc(var(--u)*.7);background:#fffaf2;border:2px solid var(--ink);border-radius:calc(var(--u)*1.1);color:var(--ink)}
.qrow b{font-size:calc(var(--u)*1.7);font-weight:800}
.qrow p{margin:0;font-size:calc(var(--u)*1.45);font-weight:500;line-height:1.35;color:#5a3a20}
.qrow .qtxt{font-style:italic}
.qrow em{font-style:normal;font-size:calc(var(--u)*1.35);font-weight:700;color:#7a5a40}
.qrow.done,.qrow.lock{background:#efe4cc;opacity:.65}
.qrow.cur{border-color:#3b8a40;box-shadow:0 0 0 2px #3b8a4055}
.qtag{align-self:flex-start;padding:0 calc(var(--u)*.8);border-radius:999px;background:#3b8a40;color:#fff;font-size:calc(var(--u)*1.2);font-weight:800}
.qrow .btn{align-self:flex-end}
.bt{display:flex;align-items:center;gap:calc(var(--u)*.8)}
.bt .ic{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2)}
.bt .ic.dish{width:calc(var(--u)*4.4);height:auto}
.bchips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.5)}
.bchip{display:inline-flex;align-items:center;gap:calc(var(--u)*.4);padding:calc(var(--u)*.25) calc(var(--u)*.8);border:2px solid var(--ink);border-radius:999px;background:#fff;font-size:calc(var(--u)*1.35);font-weight:700;color:var(--ink)}
.bchip .ic{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2)}
.bchip small{display:inline;font-size:calc(var(--u)*1.1);font-weight:600;color:#7a5a40}
.bchip.no{background:#f9d6cc}
.bsum{display:flex;gap:calc(var(--u)*1.6);flex-wrap:wrap;font-size:calc(var(--u)*1.5);font-weight:700;color:var(--ink)}
.bline{display:flex;justify-content:space-between;gap:calc(var(--u)*1);font-size:calc(var(--u)*1.4);font-weight:600;color:#5a3a20}
.bpos{color:#2f7a35}.bneg{color:#b8321e}
.bchart{display:flex;align-items:flex-end;gap:calc(var(--u)*.7);height:calc(var(--u)*9);padding:calc(var(--u)*.8);margin-bottom:calc(var(--u)*.7);background:#fffaf2;border:2px solid var(--ink);border-radius:calc(var(--u)*1.1)}
.bbar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:calc(var(--u)*.3)}
.bbar i{display:block;width:100%;min-height:2px;border-radius:calc(var(--u)*.4) calc(var(--u)*.4) 0 0}
.bbar i.pos{background:#3b8a40}.bbar i.neg{background:#c8462e}
.bbar small{font-size:calc(var(--u)*1.1);font-weight:700;color:#7a5a40}
.qbar{height:calc(var(--u)*.9);border:2px solid var(--ink);border-radius:999px;background:#e8d6b0;overflow:hidden}
.qbar i{display:block;height:100%;background:#3b8a40}
#nav{display:none}
#quick{position:absolute;right:calc(var(--u)*1.1);bottom:calc(var(--u)*10.5);z-index:4;display:flex;gap:calc(var(--u)*.5)}
#toast{
  position:absolute;top:calc(var(--u)*6.2);left:50%;transform:translateX(-50%);
  max-width:72%;background:#2a1a10ee;color:#ffe7a8;
  border:2px solid #f0b429;border-radius:999px;
  padding:calc(var(--u)*.45) calc(var(--u)*1.6);
  font-weight:700;text-align:center;z-index:3;
  box-shadow:0 4px 0 #0006;
}
#toast:empty{display:none}
#modal{
  display:none;position:absolute;
  inset:calc(var(--u)*4.2) calc(var(--u)*12);
  background:var(--paper);border:3px solid var(--ink);
  border-radius:calc(var(--u)*1.4);
  box-shadow:0 10px 0 #1a100866,0 18px 30px #0006;
  flex-direction:column;z-index:5;overflow:hidden;
}
#mh{
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(var(--u)*.7) calc(var(--u)*1.2);
  border-bottom:3px solid var(--ink);
  background:linear-gradient(#f7e7c4,#e7d2a4);
  font-weight:800;font-size:calc(var(--u)*2.3);
}
#mh .btn{box-shadow:0 2px 0 #8a2d1c}
#mbody{padding:calc(var(--u)*1) calc(var(--u)*1.2);overflow:auto;flex:1;background:linear-gradient(#fffaf2,#f7edd8)}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*.8);
  padding:calc(var(--u)*.7) calc(var(--u)*.8);margin-bottom:calc(var(--u)*.6);
  background:#fffaf2;border:2px solid #3a2412;border-radius:calc(var(--u)*.9);

}
.row .name{display:flex;align-items:center;gap:calc(var(--u)*.7);flex:1;min-width:0}
.row small,.hint{display:block;font-size:calc(var(--u)*1.45);color:#7a5a40;font-weight:500}
.ing{display:flex;gap:calc(var(--u)*.7);margin-top:2px;font-size:calc(var(--u)*1.45)}
.ing span{display:inline-flex;align-items:center;background:#f3e6cc;border-radius:999px;padding:0 calc(var(--u)*.4)}
.ing .ic{width:calc(var(--u)*2.1);height:calc(var(--u)*2.1)}
.lack{color:var(--clay);font-weight:700;background:#fde4dc}
h3{margin:calc(var(--u)*1) 0 calc(var(--u)*.6);color:var(--leafd);font-size:calc(var(--u)*2)}
.btn{
  font:700 calc(var(--u)*1.7) "Be Vietnam Pro",sans-serif;color:#fff;
  background:linear-gradient(#5cb356,#3b8a40);
  border:2px solid var(--ink);border-radius:calc(var(--u)*.7);
  box-shadow:0 3px 0 var(--leafd);
  padding:calc(var(--u)*.4) calc(var(--u)*1);
  cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:calc(var(--u)*.4);
}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.gold{background:linear-gradient(#ffe08a,#f0b429);color:var(--ink);box-shadow:0 3px 0 var(--goldd)}
.btn.red{background:linear-gradient(#e26852,#c8462e);box-shadow:0 3px 0 #8a2d1c}
.btn .ic{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2)}
.bar{height:calc(var(--u)*1.3);flex:1;min-width:calc(var(--u)*6);background:#efe0c2;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6dbd5e,#3f8f45)}

b.n{font-weight:800}.empty{color:#7a5a40;text-align:center;padding:calc(var(--u)*1)}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#0b140f;color:#ffe7a8;align-items:center;justify-content:center;text-align:center;font-size:18px;padding:28px;line-height:1.6;font-weight:700}

/* ===== Túi đồ dạng lưới (pixel) ===== */
#game{--n:calc(var(--u)*.4)}
#modal.bagmode{inset:calc(var(--u)*3.4) calc(var(--u)*5) calc(var(--u)*10.4) calc(var(--u)*5);padding:calc(var(--u)*.7);
  background:repeating-linear-gradient(0deg,#7a4e2a 0 calc(var(--u)*1.2),#6b4423 calc(var(--u)*1.2) calc(var(--u)*2.4));
  border:3px solid #2a1a10;border-radius:calc(var(--u)*.6);
  box-shadow:inset 0 0 0 calc(var(--u)*.3) #a8733a,inset 0 0 0 calc(var(--u)*.5) #3a2412,0 6px 0 #1a1008aa,0 14px 24px #0007}

#modal.bagmode #mbody{background:#3a2412;padding:calc(var(--u)*.8);overflow:hidden;display:flex}
.bag{display:flex;gap:calc(var(--u)*.8);width:100%;min-height:0}
.bgrid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:calc(var(--u)*.45);align-content:start;overflow:auto;padding:2px}
.cell{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;border:0;padding:0;margin:0;cursor:pointer;
  background:#d8c49a;box-shadow:inset 0 0 0 2px #2a1a10,inset 3px 3px 0 3px #efe0c2,inset -3px -3px 0 3px #b79c68;
  clip-path:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)))}
.cell .ic{width:calc(var(--u)*5.4);height:calc(var(--u)*5.4)}
.cell.void{cursor:default;background:#a68f62;box-shadow:inset 0 0 0 2px #2a1a10,inset 3px 3px 0 3px #8f7a50,inset -3px -3px 0 3px #bba577}
.cell.held{box-shadow:inset 0 0 0 2px #2a1a10,inset 0 0 0 5px #3ba56e}

.cell .q{position:absolute;right:calc(var(--u)*.55);bottom:calc(var(--u)*.3);font-size:calc(var(--u)*1.35);font-weight:800;color:#2a1a10;text-shadow:0 1px 0 #fff9}
.cell .hk{position:absolute;left:calc(var(--u)*.55);top:calc(var(--u)*.5);font-size:calc(var(--u)*1.1);font-weight:800;background:#2a1a10;color:#ffe7a8;min-width:calc(var(--u)*1.7);line-height:calc(var(--u)*1.7);text-align:center}
.side{width:calc(var(--u)*21);flex:none;display:flex;flex-direction:column;gap:calc(var(--u)*.5);overflow:auto;background:#f3e2c0;padding:calc(var(--u)*.9);
  box-shadow:inset 0 0 0 2px #2a1a10,inset 0 0 0 4px #d8c49a;
  clip-path:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)))}
.side .big{text-align:center}.side .big .ic{width:calc(var(--u)*8);height:calc(var(--u)*8)}
.side .nm{text-align:center;font-size:calc(var(--u)*2)}.side small{text-align:center}

/* ===== Bảng nấu: chọn nguyên liệu ===== */
.cookui{display:flex;gap:calc(var(--u)*1);width:100%;min-height:0}

.rtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*.5)}

const cache={};
function make(rows,over={}){const c=document.createElement('canvas');c.width=c.height=10;const x=c.getContext('2d');
 const px=(i,j)=>rows[j]&&rows[j].padEnd(8,'.')[i];const f=(i,j)=>{const k=px(i,j);return k&&k!=='.'};
 for(let j=-1;j<9;j++)for(let i=-1;i<9;i++){
  if(f(i,j)){x.fillStyle=over[px(i,j)]||P[px(i,j)]||'#f0f';x.fillRect(i+1,j+1,1,1)}

 return c.toDataURL()}

 S[id]?make(S[id]):make(S.face));

})();

 cloud:(b,x,y,s=1)=>{const P=[[9,10,7],[19,6,9],[31,8,8],[40,11,6],[22,12,8]],f=v=>Math.round(v*s);
  P.forEach(([cx_,cy,r])=>disc(b,x+f(cx_),y+f(cy)+2,f(r),'#cfe3f0'));
  P.forEach(([cx_,cy,r])=>disc(b,x+f(cx_),y+f(cy),f(r),'#fdfeff'));
  rr(b,x+f(4),y+f(15),f(42),f(3),'#cfe3f0');rr(b,x+f(6),y+f(14),f(38),f(2),'#fdfeff');
  P.forEach(([cx_,cy,r],i)=>{if(i<4)rr(b,x+f(cx_)-f(r*.4),y+f(cy)-f(r*.62),Math.max(2,f(r*.5)),1,'#ffffff')});
  rr(b,x+f(8),y+f(17),f(34),1,'#bcd6e6')},
 // bầu trời: 6 dải xanh đậm→nhạt, chuyển dải bằng 3 hàng rây điểm ảnh
 sky:(b,w,h)=>{const C=['#5aaee4','#74bfee','#8fcdf2','#aadcf6','#c3e6f9','#dbf1fa'],n=C.length,bh=h/n;
  for(let k=0;k<n;k++){const y0=Math.round(k*bh),y1=Math.round((k+1)*bh);rr(b,0,y0,w,y1-y0,C[k]);
   if(k<n-1)for(let j=0;j<3;j++)for(let q=0;q<w;q+=2)if(((q>>1)+j)%2===0)rr(b,q,y1-1-j,2,1,C[k+1])}},
 // mặt trời: quầng 2 lớp, lõi 3 tông, tia ngắn
 sun:(b,x,y,r)=>{disc(b,x,y,r+9,'#d4eefa');disc(b,x,y,r+5,'#e8f7fc');
  for(let a=0;a<8;a++){const t=a*Math.PI/4;for(let d=r+3;d<r+8;d++)rr(b,Math.round(x+Math.cos(t)*d),Math.round(y+Math.sin(t)*d),1,1,'#fff6c0')}
  disc(b,x,y,r,'#ffd95a');disc(b,x,y,r-1,'#ffe27a');disc(b,x-1,y-1,Math.max(2,r-4),'#fff2a8');rr(b,x-3,y-4,2,1,'#fffbe0')},
 // dãy đồi / núi xa: sườn lượn theo sin + nhiễu, vạch sáng ở sống đồi, vài cây nhỏ trên sườn
 hills:(b,x,y,w,h,c,seed=1)=>{for(let i=0;i<w;i++){const t=i+x,top=y+Math.round(Math.sin(t*.031+seed)*5+Math.sin(t*.07+seed*2)*2.5+((hs(t>>2,seed)%3)-1)*.8);
   rr(b,t,top,1,h,c);rr(b,t,top,1,1,tn(c,.3));rr(b,t,top+1,1,1,tn(c,.14));
   if(hs(t,seed+9)%37===0){const tc=tn(c,-.32);rr(b,t,top-3,3,3,tc);rr(b,t+1,top-4,1,1,tc)}}
  for(let i=0;i<w*h/80;i++){const t=x+hs(i,seed+3)%w,j=y+9+hs(i,seed+4)%Math.max(1,h-9);rr(b,t,j,2,1,tn(c,-.12))}},
 // nhà phố nền (không tương tác): vữa trát, đá góc, chân tường, gờ tầng, mái ngói + ống khói, cửa sổ chớp + hộp hoa, cửa chính + cửa kính, biển treo
 town:(b,x,y,w,gy,wall,roof,o={})=>{const h=gy-y,fl=y+Math.round(h*.46);
  blk(b,x,y,w,h,wall);for(let i=0;i<w*h/20;i++)rr(b,x+2+hs(i,1)%(w-4),y+2+hs(i,2)%(h-4),1,1,tn(wall,i%2?-.09:.12));
  rr(b,x+1,y+1,w-2,1,tn(wall,.28));rr(b,x+w-3,y+2,2,h-2,tn(wall,-.14));
  [x+1,x+w-3].forEach(q=>{for(let j=y+4;j<gy-8;j+=6)rr(b,q,j,2,3,tn(wall,-.22))});
  rr(b,x,gy-5,w,5,'#a39c90');for(let q=x;q<x+w;q+=6)rr(b,q,gy-5,5,2,'#b8b2a6');rr(b,x,gy-5,w,1,'#d0cabc');
  rr(b,x,fl,w,2,tn(wall,-.26));rr(b,x,fl,w,1,tn(wall,.3));
  A.tiles(b,x-2,y-11,w+4,11,roof);if(o.chim){blk(b,x+w-14,y-20,6,10,'#a8573a');rr(b,x+w-15,y-21,8,2,'#6b3a24');rr(b,x+w-13,y-19,2,5,'#c07a5a')}
  const n=Math.max(1,Math.floor((w-8)/20)),gap=(w-8)/n,wh=Math.max(7,Math.min(11,fl-y-9));
  for(let i=0;i<n;i++)A.win(b,Math.round(x+4+gap*i+gap/2-5),y+5,10,wh,{sh:o.sh||'#5f9a4a',box:i%2===0,cur:o.cur});
  const dh=Math.min(15,gy-fl-8);A.door(b,Math.round(x+w/2-(o.left?-6:5)),gy-5-dh,10,dh,o.door||'#6b4423');
  A.win(b,o.left?x+4:x+w-17,fl+5,13,Math.max(6,gy-fl-15),{sh:o.sh||'#5f9a4a'});
  if(o.sign){rr(b,x+w-4,fl-5,8,1,'#4a2e18');blk(b,x+w-2,fl-4,8,7,o.sign);rr(b,x+w,fl-2,4,1,'#fff')}},
 lantern:(b,x,y,c='#d8402e')=>{rr(b,x+3,y-8,1,8,OL);blk(b,x,y,8,10,c);rr(b,x+2,y+3,4,3,'#ffd86a');rr(b,x+2,y,4,1,'#f2d04a');rr(b,x+3,y+10,2,4,'#f2d04a')},
 jar:(b,x,y,c)=>{blk(b,x+1,y,6,3,'#c4a06a');blk(b,x,y+2,8,9,c);rr(b,x+2,y+5,2,3,tn(c,.5))},
 crate:(b,x,y,w=16,h=12,c='#b07a40')=>{blk(b,x,y,w,h,c);rr(b,x+2,(y+h/2)|0,w-4,1,tn(c,-.3));rr(b,x+(w>>1),y+2,1,h-4,tn(c,-.3))},
 barrel:(b,x,y,c='#8b5a2b')=>{blk(b,x,y,14,18,c);rr(b,x+1,y+4,12,1,'#3a2412');rr(b,x+1,y+12,12,1,'#3a2412')},
 sack:(b,x,y,c='#e8d9b0')=>{orb(b,x+7,y+9,7,c);blk(b,x+4,y,6,4,tn(c,-.1));rr(b,x+4,y+3,6,1,'#c8462e')},
 basket:(b,x,y,f)=>{blk(b,x,y+4,16,10,'#c49a50');for(let i=0;i<4;i++)rr(b,x+2+i*4,y+7,2,1,'#8a6428');if(f){orb(b,x+4,y+3,3,f);orb(b,x+9,y+2,3,tn(f,.1));orb(b,x+13,y+4,2,f)}},
 pot:(b,x,y,c='#c8643a')=>{orb(b,x+4,y+3,4,'#4a9a3c');orb(b,x+10,y+2,4,'#5fb04a');rr(b,x+7,y-2,2,2,'#f1a0b0');blk(b,x+1,y+8,12,8,c);blk(b,x,y+6,14,3,tn(c,.1))},
 bush:(b,x,y,c='#4a9a3c')=>{orb(b,x+6,y+7,6,c);orb(b,x+14,y+8,5,tn(c,.08));orb(b,x+10,y+4,5,tn(c,.14));[[5,4],[12,2],[16,7],[8,9]].forEach(([i,j])=>rr(b,x+i,y+j,2,2,'#f6b0c0'))},
 tree:(b,x,y,c='#3f9a4a')=>{blk(b,x+6,y+14,6,18,'#7a4a24');orb(b,x+9,y+8,9,c);orb(b,x+2,y+13,6,tn(c,.08));orb(b,x+16,y+13,6,tn(c,.05));orb(b,x+9,y+3,6,tn(c,.18));[[5,8],[14,5],[12,14]].forEach(([i,j])=>rr(b,x+i,y+j,2,2,'#e8483a'))},
 flower:(b,x,y,c)=>{rr(b,x+1,y+3,1,4,'#3f7a32');rr(b,x,y,3,3,c);rr(b,x+1,y+1,1,1,'#f2d04a')},
 stone:(b,x,y,w=10)=>blk(b,x,y,w,Math.max(4,w*.6|0),'#a8a8a0'),
 lily:(b,x,y,f)=>{ell(b,x+4,y+2,5,2,'#4a9a3c');rr(b,x+4,y,1,2,'#3a7a32');if(f){rr(b,x+2,y-2,4,3,'#f6b0c0');rr(b,x+3,y-3,2,2,'#fff0f4');rr(b,x+3,y-1,2,1,'#f2d04a')}},
 fence:(b,x,y,n,c='#c4a06a')=>{rr(b,x,y+3,n*8-3,2,'#8b5a2b');rr(b,x,y+8,n*8-3,2,'#8b5a2b');for(let i=0;i<n;i++)blk(b,x+i*8,y,5,13,c)},
 lamp:(b,x,y)=>{blk(b,x+3,y+12,4,26,'#5a3a20');blk(b,x,y,10,13,'#f2c23a');rr(b,x+2,y+3,6,6,'#fff3b0');blk(b,x-1,y-3,12,4,'#8b5a2b')},
 sign:(b,x,y)=>{blk(b,x+4,y+4,4,22,'#6b4423');blk(b,x-4,y,20,8,'#c4a06a');rr(b,x-2,y+3,14,1,'#8b5a2b');blk(b,x+6,y+10,16,7,'#d8b56a')},
 // ---- BỘ DỰNG NHÀ: mái rơm / mái ngói, vách ván, cửa sổ, cửa gỗ, đồ treo. A.hut và các cổng ở core.js (poi*) đều dùng bộ này ----
 // mái rơm hình thang: thớ rơm dọc, 3 dải đậm nhạt, mép dưới tua tủa, gờ nóc có hai cọc chéo
 thatch:(b,x,y,w,h,c)=>{const ins=w*.24,ext=j=>{const f=1-j/(h-1),d=(ins*f)|0;return[x+d,x+w-d]};
  for(let j=0;j<h;j++){const[l,r]=ext(j);rr(b,l-1,y+j,r-l+2,1,OL)}
  for(let j=0;j<h;j++){const[l,r]=ext(j);rr(b,l,y+j,r-l,1,tn(c,[.14,0,-.1][((j/3)|0)%3]))}
  for(let i=0;i<w*1.2;i++){const q=x+((i*7+hs(i,3))%w),j0=hs(i,5)%Math.max(1,h-4),n=3+hs(i,7)%5;for(let j=j0;j<Math.min(h,j0+n);j++){const[l,r]=ext(j);if(q>l&&q<r-1)rr(b,q,y+j,1,1,i%3?tn(c,-.24):tn(c,.3))}}
  const[l,r]=ext(h-1);for(let q=l;q<r;q+=2){const n=1+hs(q,9)%3;rr(b,q,y+h,1,n,OL);rr(b,q,y+h,1,n-1,tn(c,-.18))}
  const rl=x+((w*.27)|0),rw=(w*.46)|0;blk(b,rl,y-3,rw,5,tn(c,.12));for(let k=2;k<rw-2;k+=3)rr(b,rl+k,y-2,1,3,tn(c,-.22));
  rr(b,rl-1,y-6,1,5,'#6b4423');rr(b,rl+rw,y-6,1,5,'#6b4423');rr(b,rl-2,y-7,1,2,'#8b5a2b');rr(b,rl+rw+1,y-7,1,2,'#8b5a2b')},
 // mái ngói đỏ: các hàng ngói lợp so le, bóng dưới mép, gờ nóc
 tiles:(b,x,y,w,h,c)=>{const ins=w*.12,ext=j=>{const f=1-j/(h-1),d=(ins*f)|0;return[x+d,x+w-d]};
  for(let j=0;j<h;j++){const[l,r]=ext(j);rr(b,l-1,y+j,r-l+2,1,OL)}rr(b,x-1,y+h,w+2,1,OL);
  for(let j=0;j<h;j++){const[l,r]=ext(j),row=(j/4)|0,off=(row%2)*3;rr(b,l,y+j,r-l,1,tn(c,j%4===3?-.3:j%4===0?.18:0));
   if(j%4!==3)for(let q=l+off;q<r;q+=6)rr(b,q,y+j,1,1,tn(c,-.32))}
  for(let q=x+2;q<x+w-2;q+=6)rr(b,q,y+h-1,4,1,tn(c,.25));rr(b,x,y+h,w,2,tn(c,-.5));
  blk(b,x+((w*.1)|0),y-3,(w*.8)|0,5,tn(c,-.12));rr(b,x+((w*.1)|0)+1,y-2,((w*.8)|0)-2,1,tn(c,.3))},
 // vách ván đứng: khe ván, vân gỗ, bóng dưới mái, nền đá (stone=0 thì không có nền đá)
 walls:(b,x,y,w,h,c,stone=1)=>{blk(b,x,y,w,h,c);for(let q=x+4;q<x+w-2;q+=5){rr(b,q,y+2,1,h-3,tn(c,-.24));rr(b,q+1,y+2,1,h-3,tn(c,.14))}
  for(let i=0;i<w*h/38;i++){const q=x+2+hs(i,1)%(w-4),j=y+3+hs(i,2)%Math.max(1,h-5);rr(b,q,j,1,2,tn(c,-.16))}
  rr(b,x+1,y+1,w-2,2,tn(c,-.32));if(stone){const sy=y+h-4;rr(b,x,sy,w,4,'#8f8a80');for(let q=x;q<x+w;q+=7){rr(b,q,sy,6,2,'#a8a398');rr(b,q+3,sy+2,6,2,'#9d988d');rr(b,q+6,sy,1,4,'#6f6a60')}rr(b,x,sy,w,1,'#c4bfb2')}},
 // cửa sổ: khung gỗ, kính 2 tông + ô chia + vệt sáng, chớp hai bên (sh), rèm (cur), hộp hoa (box)
 win:(b,x,y,w,h,o={})=>{if(o.sh){const sw=Math.max(3,(w/3)|0);[x-sw-1,x+w+1].forEach((sx,k)=>{blk(b,sx,y-1,sw,h+2,o.sh);for(let j=y+1;j<y+h;j+=2)rr(b,sx+1,j,sw-2,1,tn(o.sh,-.28))})}
  blk(b,x-1,y-1,w+2,h+2,'#8b5a2b');rr(b,x,y,w,h,'#a8dcf0');rr(b,x,y+(h>>1),w,h-(h>>1),'#cfeaf6');
  if(w>=7){rr(b,x+(w>>1),y,1,h,'#8b5a2b');rr(b,x,y+(h>>1),w,1,'#8b5a2b')}
  rr(b,x+1,y+1,2,1,'#fff');rr(b,x+1,y+2,1,2,'#fff');
  if(o.cur){rr(b,x,y,3,h>>1,o.cur);rr(b,x+w-3,y,3,h>>1,o.cur);rr(b,x+1,y+(h>>1)-1,1,1,tn(o.cur,-.3))}
  rr(b,x-2,y+h,w+4,1,'#6b4423');if(o.box){blk(b,x-2,y+h+1,w+4,3,'#8b5a2b');for(let q=0;q<w+2;q+=2){rr(b,x-1+q,y+h-1,2,2,['#f6b0c0','#f2d04a','#fff','#e8483a'][(q/2+(x>>1))%4]);rr(b,x-1+q,y+h+1,1,1,'#3f9a3c')}}},
 // cửa gỗ: khung, ván đứng, tay nắm vàng, ô kính nhỏ (w>=10), bậc đá + thảm chùi chân
 door:(b,x,y,w,h,c='#6b4423')=>{blk(b,x-1,y-1,w+2,h+1,'#4a2e18');rr(b,x,y,w,h,c);for(let q=x+3;q<x+w-1;q+=3){rr(b,q,y+1,1,h-1,tn(c,-.28));rr(b,q+1,y+1,1,h-1,tn(c,.14))}
  rr(b,x+1,y+1,w-2,1,tn(c,.25));rr(b,x+w-3,y+(h>>1),2,2,'#f2d04a');rr(b,x+w-3,y+(h>>1),1,1,'#fff2a8');
  if(w>=10){rr(b,x+2,y+2,w-4,4,'#a8dcf0');rr(b,x+(w>>1),y+2,1,4,'#4a2e18');rr(b,x+2,y+2,2,1,'#fff')}
  rr(b,x-2,y+h,w+4,2,'#b8aea0');rr(b,x-2,y+h,w+4,1,'#d8d0c0');rr(b,x+1,y+h+2,w-2,1,'#c8462e')},
 // dây ớt / tỏi / bắp treo tường
 hang:(b,x,y,k=0)=>{rr(b,x,y,1,11,'#6b4423');for(let j=1;j<11;j+=2){const c=k===0?'#d8301f':k===1?'#f6f0d0':'#f2c030';rr(b,x-1,y+j,1,2,c);rr(b,x+1,y+j+(k===0?0:1),1,2,tn(c,-.2))}},
 // bó rơm tròn: các vòng thớ + dây buộc
 hay:(b,x,y,r)=>{orb(b,x,y,r,'#e0b848');for(let i=1;i<r;i+=2)rr(b,x-((r*r-i*i)**.5|0)+1,y+i-r+(r>>1),Math.max(1,2*((r*r-i*i)**.5|0)-2),1,'#b88a28');rr(b,x-r+2,y-1,2*r-4,1,'#8b5a2b');rr(b,x-1,y-r+1,1,2*r-2,'#c89a38');rr(b,x-r+3,y-r+3,2,1,'#fff2a8')},
 // mái hiên vải sọc có viền lượn sóng, nếp gấp, bóng đổ
 awning:(b,x,y,w,h,c1='#d8402e',c2='#fffaf0')=>{const n=Math.round(w/8),sw=w/n;
  for(let i=0;i<n;i++){const c=i%2?c2:c1,xi=Math.round(x+i*sw),wi=Math.round(sw);blk(b,xi,y,wi+1,h,c);rr(b,xi+1,y+1,1,h-2,tn(c,.22));rr(b,xi+wi-1,y+2,1,h-3,tn(c,-.2));
   const sc=wi>>1;orb(b,xi+sc,y+h,sc,c);rr(b,xi+sc-1,y+h-2,2,1,tn(c,.25))}
  rr(b,x,y,w,2,tn(c1,-.25));rr(b,x,y+2,w,1,tn(c1,-.1))},
 hut:(b,x,y,w,wall='#e8c888',roof='#c89a4a')=>{

  [x+6,x+w-9].forEach(px=>{rr(b,px,y+42,3,8,OL);rr(b,px+1,y+42,1,7,'#7a5230')});rr(b,x+8,y+46,w-16,1,'#5a3a20');

  A.door(b,x+(w>>1)-4,y+29,8,13);
  A.win(b,x+7,y+28,8,7,{sh:'#5f9a4a',box:1});A.win(b,x+w-15,y+28,8,7,{sh:'#5f9a4a',box:1});
  A.hang(b,x+(w>>1)+6,y+25,0);A.lantern(b,x+(w>>1)-9,y+22,'#f2a82a')},
 boards:(b,x,y,w,h,c1,c2)=>{for(let r=0,yy=y;yy<y+h;r++,yy+=14){rr(b,x,yy,w,14,r%2?c2:c1);rr(b,x,yy,w,1,tn(r%2?c2:c1,.25));rr(b,x,yy+13,w,1,tn(c2,-.3));for(let xx=x+(r%2)*30;xx<x+w;xx+=60)rr(b,xx,yy,1,14,tn(c2,-.3))}},
};
const dog=(x,y,t,c='#d89a58')=>{const bob=Math.sin(t/180)>0?1:0,wag=Math.sin(t/90)>0?1:0;
 blk(cx,x,y,13,8,c);blk(cx,x+9,y-5,9,8,c);rr(cx,x+10,y-6,2,3,tn(c,-.35));rr(cx,x+16,y-6,2,3,tn(c,-.35));

// restaurant.js — logic nhà hàng: khách vào cửa → ra quầy gọi món → ngồi bàn → chờ món → ăn → trả tiền → ra về

  c.st='leave';c.path=p;c.qk=null;c.seat=-1};

  const d=G.delivering;if(d&&d.st==='serving'&&G.P.st==='idle'&&!G.P.task)G.cancelDeliver();
  if(G.ui.zone!=='shop')return; // không ở quán → khách đứng yên, không đến thêm, không bực (nấu/trồng trọt xong rồi hãy vào mở cửa)

  let qi=0;

    else if(c.st==='leave'){if(mv(c,dt))c.dead=true}});

G.takeOrder=(c,auto)=>{if(c.st!=='order')return;

  if(!free.length)return auto?0:G.msg('Hết bàn rồi!');

// Mang món ra bàn
G.cancelDeliver=()=>{const c=G.delivering;if(c&&c.st==='serving'){G.add(c.want);c.st='wait'}G.carry=null;G.delivering=null};
G.deliver=c=>{if(c.st!=='wait')return;const r=G.RECIPES[c.want];
  if(!G.has(c.want)){G.msg('Chưa có '+r.n+' — nấu món này nhé');G.ui.rec=c.want;G.ui.pot={};G.ui.modal='cook';G.refreshUI&&G.refreshUI();return}
  if(G.delivering)G.cancelDeliver();
  const R=G.REST,s=R.seats[c.seat];
  c.st='serving';c.fast=c.p/G.CFG.patience>.5;c.pay=Math.round(r.price*(c.fast?1.2:1)*(1+.05*Math.max(0,G.stars()-3)));G.add(c.want,-1);G.carry=c.want;G.delivering=c;
  G.walk([[R.gateOut.x,R.gateOut.y],[R.gateIn.x,R.gateIn.y],[s.x,96]],()=>{
    G.P.work('serve',.5,()=>{G.carry=null;G.delivering=null;c.st='eat';c.eatT=G.CFG.eatTime;
      G.walk([[R.gateIn.x,R.gateIn.y],[R.gateOut.x,R.gateOut.y],[R.home.x,R.home.y]])})})};

// MỞ / ĐÓNG CỬA: chỉ khi mở cửa khách mới đến. Đóng cửa → khách đang có trong quán vẫn được phục vụ nốt.
G.openShop=()=>{const S=G.S;if(S.open)return;S.open=true;S.spawn=Math.max(S.spawn,G.CFG.customerEvery*.75);
  const ready=Object.keys(G.RECIPES).filter(k=>S.inv[k]>0).length;
  G.msg(ready?'Mở cửa! Chào đón khách nhé':'Mở cửa rồi — chưa có món sẵn, nhớ nấu nhé!');G.snd&&G.snd.bell&&G.snd.bell()};
G.closeShop=()=>{const S=G.S;if(!S.open)return;S.open=false;G.msg(S.customers.length?'Đóng cửa — phục vụ nốt khách trong quán':'Đã đóng cửa')};

// book.js — SỔ SÁCH: sổ thu chi + sổ công thức. File này chỉ giữ dữ liệu; ui.js (modal 'book') dựng bảng.
(()=>{
// ===== Thu chi =====
// Mọi thay đổi tiền trong game đều đi qua G.earn / G.spend (cat = loại khoản, xem G.BOOK_CAT) để sổ ghi lại.
// S.book = {days:{[ngày game]:{inc:{loại:xu}, exp:{…}}}, tot:{inc:{…}, exp:{…}}}; theo ngày chỉ giữ 14 ngày gần nhất.
G.BOOK_CAT={
  inc:{stall:'Bán món ở xe đẩy',shop:'Bán món ở nhà hàng',crop:'Bán nông sản',animal:'Bán sản phẩm vật nuôi',ing:'Bán nguyên liệu',reward:'Thưởng nhiệm vụ'},
  exp:{seed:'Mua hạt giống',ing:'Mua nguyên liệu',plot:'Mở ô đất',animal:'Mua vật nuôi',kit:'Nâng cấp bếp',build:'Sửa xe đẩy'}};
const KEEP=14;
const state=()=>G.S.book||(G.S.book={days:{},tot:{inc:{},exp:{}}});
const note=(kind,cat,n)=>{const B=state(),d=B.days[G.S.day]||(B.days[G.S.day]={inc:{},exp:{}});
  d[kind][cat]=(d[kind][cat]||0)+n;B.tot[kind][cat]=(B.tot[kind][cat]||0)+n;
  Object.keys(B.days).forEach(k=>{if(G.S.day-k>=KEEP)delete B.days[k]})};
G.earn=(n,cat)=>{G.S.money+=n;note('inc',cat,n)};
G.spend=(n,cat)=>{G.S.money-=n;note('exp',cat,n)};
// Loại khoản khi bán một vật phẩm: nông sản / sản phẩm vật nuôi / nguyên liệu
G.sellCat=id=>G.CROPS[id]?'crop':Object.values(G.ANIMALS).some(a=>a.make===id)?'animal':'ing';
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
G.bookMoney=()=>{const B=state(),day=G.S.day,t=B.days[day]||{inc:{},exp:{}},chart=[];
  for(let d=Math.max(1,day-6);d<=day;d++){const x=B.days[d]||{inc:{},exp:{}};chart.push({day:d,profit:sum(x.inc)-sum(x.exp)})}
  return{day,today:{inc:t.inc,exp:t.exp,incSum:sum(t.inc),expSum:sum(t.exp)},
    total:{inc:B.tot.inc,exp:B.tot.exp,incSum:sum(B.tot.inc),expSum:sum(B.tot.exp)},chart}};

// ===== Công thức =====
// Nguồn nguyên liệu: trồng ở ruộng / nuôi / mua ở chợ
const srcOf=id=>G.CROPS[id]?'trồng':Object.values(G.ANIMALS).some(a=>a.make===id)?'nuôi':G.ITEMS[id]&&G.ITEMS[id].buy!=null?'chợ':'';
// Vốn ước tính cho 1 đơn vị: đồ mua = giá chợ; cây trồng = giá hạt / 1,3 (mỗi cây thu trung bình 1,3); còn lại = giá bán
const costOf=id=>{const it=G.ITEMS[id]||{};return it.buy!=null?it.buy:G.CROPS[id]?G.CROPS[id].seed/1.3:(it.sell||0)};
G.bookRecipes=()=>{const S=G.S,menu=G.STALL_MENU||[];
  return Object.keys(G.RECIPES).map(k=>{const r=G.RECIPES[k],need=Object.entries(r.need),cost=Math.round(need.reduce((a,[id,n])=>a+costOf(id)*n,0));
    return{id:k,n:r.n,place:menu.includes(k)?'stall':'shop',unlocked:G.unlocked(k),unlock:r.unlock||0,served:S.served,price:r.price,cost,profit:r.price-cost,
      need:need.map(([id,n])=>({id,name:G.ITEMS[id]?G.ITEMS[id].n:id,n,have:S.inv[id]||0,src:srcOf(id)}))}})
    .sort((a,b)=>(a.place===b.place?0:a.place==='stall'?-1:1)||a.unlock-b.unlock)};

// Nút nhỏ mở sổ sách (góc trên bên phải, cạnh nút nhiệm vụ)
G.bookHTML=()=>`<button class="tbtn" data-modal="book" title="Sổ sách">${G.ic('book')}</button>`;
})();

// progress.js — TIẾN TRÌNH: cấp quán (G.S.tier) + chuỗi nhiệm vụ dẫn dắt người chơi.
// Cấp 0: chỉ làm nông, xe đẩy cũ của bà còn phủ bạt ở làng · Cấp 1: đã sửa xe đẩy (mở màn bán ở zones/stall.js).
// Cấp 2, 3 (quán bình dân, nhà hàng) sẽ nối tiếp ở đây + POI_TIER trong core.js.
G.PROG={
  // Xu cần để sửa xe đẩy. Cân theo mô phỏng nông trại (giá hạt, thời gian lớn, giá bán, 10 ô đầu game rồi mở thêm từng ô):
  // người chơi cẩn thận đủ 1000 xu sau khoảng 3 phút, người chơi chậm khoảng 4–5 phút (ước lượng, chưa chơi thử). Muốn pha làm nông dài/ngắn hơn thì chỉnh số này.
  stallCost:1000
};

// ===== Sửa xe đẩy + khoá cổng =====
G.buildStall=()=>{const S=G.S,c=G.PROG.stallCost;
  if(S.tier>0)return;
  if(S.money<c)return G.msg('Cần '+c+' xu để sửa xe — còn thiếu '+(c-S.money));
  G.spend(c,'build');S.tier=1;G.ui.modal=null;G.msg('Xe đẩy của bà đã sửa xong! Vào mở bán nhé');
  G.snd&&G.snd.unlockChime&&G.snd.unlockChime();G.save&&G.save();G.refreshUI&&G.refreshUI()};
// Chạm vào cổng một khu: xe đẩy chưa sửa thì hiện bảng sửa xe thay vì vào khu
G.enterZone=zone=>{
  if(zone==='stall'&&!(G.S.tier>0)){G.ui.modal='build';G.refreshUI&&G.refreshUI();return}
  G.goZone(zone)};

// ===== Nhiệm vụ: chính (hướng dẫn G.QUESTS + cốt truyện G.STORY) và hàng ngày =====
// Hướng dẫn: p(S) → [đã có, cần]. d: mô tả (chuỗi hoặc hàm). r: thưởng {money, inv:{id:n}}. note: lời thoại ngắn khi nhận thưởng.
const harvested=S=>Object.values(S.stat.h).reduce((a,b)=>a+b,0);
G.QUESTS=[
  {t:'Gieo hạt đầu tiên',d:'Ruộng nhà bỏ hoang lâu rồi. Chạm vào ô đất để gieo hạt.',p:S=>[S.stat.plant,1],r:{money:10}},
  {t:'Thu hoạch 10 cây',d:'Đợi cây chín rồi bấm "Thu hoạch hết".',p:S=>[harvested(S),10],r:{money:30}},
  {t:'Trồng chanh',d:'Chanh là nguyên liệu của ly trà đầu tiên, chỉ trồng được chứ không mua. Thu hoạch 3 quả.',p:S=>[S.stat.h.chanh||0,3],r:{inv:{hat_rau_thom:3,hat_ca_rot:3}},note:'Tặng ít hạt rau thơm, cà rốt'},
  {t:'Dành dụm sửa xe của bà',d:()=>'Bán nông sản ở Chợ đầu mối. Cần '+G.PROG.stallCost+' xu để sửa chiếc xe đẩy cũ ở '+G.VILLAGE+'.',
    p:S=>S.tier>0?[1,1]:[Math.min(S.money,G.PROG.stallCost),G.PROG.stallCost],r:{}},
  {t:'Sửa xe đẩy',d:()=>'Ra '+G.VILLAGE+', chạm vào chiếc xe phủ bạt rồi bấm Sửa xe.',p:S=>[S.tier>0?1:0,1],r:{inv:{tra:3,duong:3,da:3}},note:'Bà để lại ít trà, đường và đá!'},
  {t:'Bán 5 khách đầu tiên',d:'Bấm bảng ĐÓNG CỬA để mở bán, ghép đúng món theo phiếu. Nhớ mang chanh!',p:S=>[S.served,5],r:{money:60}},
  {t:'Phục vụ 12 khách',d:'Đủ 12 khách sẽ mở khoá gỏi cuốn.',p:S=>[S.served,12],r:{money:120}}
];
// Cốt truyện: chuỗi chương nối tiếp, cùng cơ chế với hướng dẫn. Nội dung điền vào G.STORY, mỗi chương:
// {t:'Chương 1: …', txt:'lời kể hiện trong bảng nhiệm vụ', p:S=>[đã có, cần], r:{…}, note:'…'}
G.STORY=[];
// Đẩy một chuỗi nhiệm vụ tuần tự: bước list[S[key]] đạt thì phát thưởng rồi sang bước kế.
// silent=true: chỉ bỏ qua các bước đã đạt (dùng khi tải save), không phát thưởng
const stepQuests=(list,key,silent)=>{const S=G.S;let q;
  while((q=list[S[key]])){const[a,b]=q.p(S);if(a<b)break;
    if(!silent){const r=q.r||{};if(r.money)G.earn(r.money,'reward');if(r.inv)for(const k in r.inv)G.add(k,r.inv[k]);
      G.msg('Xong: '+q.t+(r.money?' · +'+r.money+' xu':'')+(q.note?' · '+q.note:''));G.snd&&G.snd.unlockChime&&G.snd.unlockChime()}
    S[key]++}};
G.checkQuest=silent=>{stepQuests(G.QUESTS,'quest',silent);stepQuests(G.STORY,'story',silent)};
G.updateProgress=(()=>{let acc=0;return dt=>{acc+=dt;if(acc<.5)return;acc=0;G.checkQuest()}})(); // kiểm tra nhiệm vụ 2 lần/giây

// Nhiệm vụ hàng ngày: 3 việc mỗi ngày thật (đổi lúc 0h), tiến độ = số hiện tại − mốc đầu ngày, bấm Nhận để lấy thưởng
const DAILY_POOL=[
  {id:'plant',t:'Gieo 10 hạt giống',n:10,v:S=>S.stat.plant,r:{money:25}},
  {id:'harvest',t:'Thu hoạch 12 nông sản',n:12,v:harvested,r:{money:35}},
  {id:'chanh',t:'Thu hoạch 5 quả chanh',n:5,v:S=>S.stat.h.chanh||0,r:{money:30}},
  {id:'rau_thom',t:'Thu hoạch 5 rau thơm',n:5,v:S=>S.stat.h.rau_thom||0,r:{money:30}},
  {id:'serve',t:'Phục vụ 6 khách ở xe đẩy',n:6,v:S=>S.served,r:{money:60},tier:1}
];
G.today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
G.msToNextDay=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)-d};
// Danh sách của hôm nay: chưa có thì tạo (chọn 3 việc cố định theo ngày, lưu mốc đầu ngày) rồi lưu vào save
const todayDaily=()=>{const S=G.S,key=G.today();
  if(S.daily&&S.daily.date===key)return S.daily;
  const pool=DAILY_POOL.filter(x=>(x.tier||0)<=S.tier),pick=[],base={};let h=0;
  for(const ch of key)h=(h*31+ch.charCodeAt(0))>>>0;
  while(pick.length<3&&pool.length){h=(h*1103515245+12345)>>>0;pick.push(pool.splice((h>>>8)%pool.length,1)[0].id)}
  DAILY_POOL.forEach(x=>base[x.id]=x.v(S));
  return S.daily={date:key,pick,base,claimed:{}}};
G.dailyList=()=>{const S=G.S,D=todayDaily();
  return D.pick.map(id=>{const x=DAILY_POOL.find(y=>y.id===id),a=Math.min(x.n,Math.max(0,x.v(S)-D.base[id])),done=!!D.claimed[id];
    return{id,t:x.t,a,b:x.n,r:x.r,claimed:done,can:a>=x.n&&!done}})};
G.claimDaily=id=>{const it=G.dailyList().find(x=>x.id===id);if(!it||!it.can)return;
  todayDaily().claimed[id]=true;G.earn(it.r.money,'reward');
  G.msg('Nhận thưởng: '+it.t+' · +'+it.r.money+' xu');G.snd&&G.snd.unlockChime&&G.snd.unlockChime()};

// Dữ liệu cho bảng nhiệm vụ (ui.js dựng HTML) + nút nhỏ ở góc màn hình
G.rewardText=r=>[r.money?r.money+' xu':'',...Object.entries(r.inv||{}).map(([k,n])=>n+' '+(G.ITEMS[k]?G.ITEMS[k].n:k))].filter(Boolean).join(', ');
const questList=(list,idx,S)=>list.map((q,i)=>{const cur=i===idx,[a,b]=i<idx?[1,1]:cur?q.p(S):[0,1];
  return{t:q.t,d:typeof q.d==='function'?q.d():q.d,txt:q.txt,state:i<idx?'done':cur?'cur':'lock',a:Math.min(a,b),b,r:G.rewardText(q.r||{})}});
G.questView=()=>({story:questList(G.STORY,G.S.story,G.S),guide:questList(G.QUESTS,G.S.quest,G.S),daily:G.dailyList(),left:G.msToNextDay()});
G.questHTML=()=>{const n=G.dailyList().filter(x=>x.can).length;
  return `<button class="tbtn" data-modal="quest" title="Nhiệm vụ">${G.ic('quest')}${n?`<span class="qdot">${n}</span>`:''}</button>`};
G.checkQuest(true);

function pick(it){

  if(s.bad)return G.msg('Món hỏng rồi — bấm Đổ đi');

}

// ===== Bộ dựng âm =====
const env=(g,t,a,d,v)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(v,.0003),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)};
const go=(n,t,len)=>{n.start(t);n.stop(t+len);busy++;n.onended=()=>busy--};
// Âm có cao độ. o: f2 (trượt tới), type, at (trễ giây), a/d (lên/tắt), v (to), lp (lọc mềm), vib [Hz,độ sâu]
function tone(f,o={}){
  if(!live()||busy>48)return;
  const t=ac.currentTime+(o.at||0)+.004,a=o.a??.004,d=o.d??.1,v=o.v??.05;
  const os=ac.createOscillator(),g=ac.createGain();

  if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+a+d);
  if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=o.vib[0];lg.gain.value=o.vib[1];l.connect(lg);lg.connect(os.frequency);go(l,t,a+d+.04)}

  n.connect(g);g.connect(o.dest||sfx);go(os,t,a+d+.04);
}
// Tiếng xì/sột soạt (nhiễu qua bộ lọc)
function hiss(type,f,o={}){
  if(!live()||busy>48)return;
  const t=ac.currentTime+(o.at||0)+.004,a=o.a??.003,d=o.d??.06,v=o.v??.05;
  const s=ac.createBufferSource();s.buffer=noise;s.loop=true;
  const b=ac.createBiquadFilter();b.type=type;b.frequency.setValueAtTime(f,t);b.Q.value=o.q??1;
  if(o.f2)b.frequency.exponentialRampToValueAtTime(o.f2,t+a+d);
  const g=ac.createGain();env(g,t,a,d,v);
  s.connect(b);b.connect(g);g.connect(sfx);s.start(t,Math.random()*1.5);s.stop(t+a+d+.04);busy++;s.onended=()=>busy--;
}
// Giọng nói "bập bẹ" (kiểu Animal Crossing): chuỗi nguyên âm [nguyên âm, hệ số cao độ, độ dài]
const VOW={a:[800,1300],o:[520,900],e:[470,2000],i:[320,2300],u:[340,950],ơ:[520,1250],ư:[360,1500]};
function say(base,seq,o={}){

const STRIDE=34,NEG=/Không đủ|Hết |đầy|Thiếu|bận|Chưa |Chọn công thức|Phục vụ \d|không có trong|^Đủ /;

  pl:S.plots.map(p=>!p?0:p.t>=G.CROPS[p.crop].time?2:1),
  an:S.animals.map(a=>({fed:a.fed,ready:a.ready})),
  cook:S.cooking.length,plots:S.plotsOpen,kit:S.kit,stars:G.stars(),done:G.potDone,pot:Object.assign({},U.pot),m:G._m,

  if(z==='hub')return (p.y>=164&&p.y<=200)||(p.x>=290&&p.x<=322&&p.y>=58)||(p.x>=230&&p.x<=382&&p.y>=56&&p.y<=100)?'stone':'grass';

function tick(){
  if(!G.S||!G.P||!G.ui)return;

  const q=prev,z=U.zone,shop=z==='shop';

  if(z!==q.zone){
    if(z==='shop'){SND.creak();SND.bell()}
    else if(z==='kitchen'||q.zone==='kitchen'||q.zone==='shop')SND.creak();
    acc=STRIDE*.5;
  }else if(P.st==='walk'){
    const d=Math.hypot(P.x-q.x,P.y-q.y);
    if(d<20){acc+=d;if(acc>=STRIDE){acc%=STRIDE;SND.step(surface())}}
  }else acc=STRIDE*.5;

  if(U.modal!==q.modal){if(!q.modal)SND.open();else if(!U.modal)SND.close();else SND.tick(1.2)}
  // nhân vật làm việc
  if(P.st==='work'&&q.st!=='work'){
    if(P.wa==='feed')SND.pourGrain();else if(P.wa==='stir')SND.swish();else if(P.wa==='serve')SND.tick(.9)}
  if(P.st==='work'&&P.wa==='dig'&&!q.fxd&&P.fxd&&!(z==='farm'&&nearAnimal()>=0))SND.dig();
  // cây trồng
  let nSeed=0,nHar=0,col=null; // gom lại: "thu hoạch hết" chỉ kêu một tiếng, không dồn dập
  S.plots.forEach((p,i)=>{const n=!p?0:p.t>=G.CROPS[p.crop].time?2:1,o=q.pl[i];
    if(o===0&&n>0)nSeed++;
    else if(o>0&&n===0)nHar++;

  if(nSeed)SND.seed();if(nHar)SND.harvest();
  // vật nuôi
  if(S.animals.length>q.an.length){SND.ding(.6);SND.cry(S.animals[S.animals.length-1].type,.7)}
  S.animals.forEach((a,i)=>{const o=q.an[i];if(!o)return;
    if(a.fed&&!o.fed)SND.cry(a.type,.8);
    if(a.ready&&!o.ready&&z==='farm'&&gate('ar',2500))SND.cry(a.type,.4);
    if(!a.ready&&o.ready)col=G.ANIMALS[a.type].make});
  if(col)SND.collect(col);
  // nâng cấp / lên sao
  if(S.plotsOpen>q.plots)SND.dig();
  if(S.kit>q.kit){SND.clank();SND.ding(1)}
  if(G.stars()>q.stars)SND.unlockChime();
  // tiền
  const dm=S.money-q.money;
  if(dm>0&&gate('coin',70))SND.coin(dm>=60,z==='market'||shop?1:.45);
  else if(dm<0&&gate('pay',70))SND.pay();
  // thông báo của game
  if(G._m!==q.m){const m=G.msgText||'';
    if(/Mở khoá món mới/.test(m))SND.unlockChime();else if(NEG.test(m)&&gate('nope',300))SND.nope()}
  // nấu ăn
  const pot=U.pot||{};
  for(const k in pot)if((pot[k]||0)>(q.pot[k]||0))SND.ingredient(k);
  if(sum(pot)<sum(q.pot)&&S.cooking.length<=q.cook)SND.pourAway();
  if(S.cooking.length>q.cook){SND.sizzle();SND.clank()}
  if(G.potDone&&G.potDone!==q.done)SND.ding(z==='kitchen'||shop?1:.45);
  // ngày mới: gà gáy (ngoài trời)
  if(S.day>q.day&&z!=='kitchen'&&!shop&&gate('crow',5000))SND.rooster(.6);
  // khách hàng
  S.customers.forEach(c=>{const o=cst.get(c);
    if(!o){cst.set(c,{st:c.st});if(shop&&gate('bell',600))SND.bell();return}
    if(o.st===c.st)return;const a=o.st,b=c.st,bp=SKIN_PITCH[c.sk&3];o.st=b;if(!shop)return;

 setInterval(()=>{if(!G.audio.cfg.mOn||ac.state!=='running'){eng.sync(ac.currentTime);return}eng.sync(ac.currentTime);eng.pump(ac.currentTime+.4)},60)};
G.music={start,make};
G.audio.ready.push(start);if(G.audio.ctx())start();
})();


/* ===== menu.js ===== */

// menu.js — MÀN HÌNH MỞ GAME (Chơi tiếp · Chơi lại · Cài đặt) + nút bánh răng và bảng CÀI ĐẶT trong game.
// Game tạm dừng (G.paused) khi màn hình đầu đang mở. "Chơi lại" xoá save rồi tải lại trang để mọi thứ bắt đầu sạch.
// Cài đặt âm thanh lưu ở G.audio.cfg (audio.js). Muốn thêm mục cài đặt: thêm 1 hàng vào HTML của #set bên dưới.
(()=>{
const game=document.getElementById('game'),SKIP='xoiBenDua_skipTitle';
const css=document.createElement('style');
css.textContent=`
#title{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#9bd0ec;transition:opacity .45s}
#title.out{opacity:0;pointer-events:none}
#title canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#title .box{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.1)}
#title h1{margin:0 0 calc(var(--u)*.2);font-weight:900;font-size:calc(var(--u)*9.5);line-height:1;color:#fff6e4;letter-spacing:.02em;-webkit-text-stroke:calc(var(--u)*.4) #2a1a10;paint-order:stroke fill;text-shadow:0 calc(var(--u)*.7) 0 #6b4423;animation:ttfloat 3.2s ease-in-out infinite}
#title .sub{margin:0 0 calc(var(--u)*1.2);font-weight:800;font-size:calc(var(--u)*2.1);color:#fff6e4;text-shadow:0 2px 0 #2a1a10,0 0 8px #2a1a10aa}
@keyframes ttfloat{50%{transform:translateY(calc(var(--u)*-.8))}}
.tb{width:calc(var(--u)*27);padding:calc(var(--u)*1) calc(var(--u)*1.4);border-radius:calc(var(--u)*1.5);border:3px solid var(--ink);font-weight:800;font-size:calc(var(--u)*2.5);color:#fff;cursor:pointer;line-height:1.15;box-shadow:0 calc(var(--u)*.55) 0 var(--sh)}
.tb small{display:block;font-weight:600;font-size:calc(var(--u)*1.35);opacity:.92;margin-top:calc(var(--u)*.2)}
.tb:active{transform:translateY(calc(var(--u)*.4));box-shadow:0 calc(var(--u)*.15) 0 var(--sh)}
.tb:disabled{opacity:.5;filter:grayscale(.7);cursor:default}
.tb.go{background:linear-gradient(#5cb356,#3b8a40);--sh:#245c2c}
.tb.new{background:linear-gradient(#ea6a52,#c8462e);--sh:#8a2d1c}
.tb.cfg{background:linear-gradient(#fffaf2,#f4e4c4);color:var(--ink);--sh:#b8841c}
#set,#cf{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:#000a}
#cf{z-index:80}
.sc{width:calc(var(--u)*52);max-width:94%;background:var(--paper);border:3px solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2) calc(var(--u)*2.4);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:calc(var(--u)*1.3)}
.sc h2{margin:0;text-align:center;font-weight:900;font-size:calc(var(--u)*3);color:var(--ink)}
.sc p{margin:0;text-align:center;font-weight:600;font-size:calc(var(--u)*1.9);line-height:1.4}
.sr{display:flex;align-items:center;gap:calc(var(--u)*1.2);background:var(--paper2);border:2px solid var(--ink);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.9) calc(var(--u)*1.3)}
.sr .sl{flex:1;font-weight:800;font-size:calc(var(--u)*2.1)}
.sr input[type=range]{width:calc(var(--u)*17);height:calc(var(--u)*2.4);accent-color:var(--leaf);margin:0}
.sw{min-width:calc(var(--u)*6.6);padding:calc(var(--u)*.55) calc(var(--u)*1);border-radius:99px;border:2px solid var(--ink);font-weight:800;font-size:calc(var(--u)*1.8);cursor:pointer;color:#fff;background:linear-gradient(#5cb356,#3b8a40)}
.sw.off{background:linear-gradient(#b8b0a0,#968e7e)}
.sb{display:flex;gap:calc(var(--u)*1);justify-content:center;flex-wrap:wrap}
.sb button{padding:calc(var(--u)*.9) calc(var(--u)*1.8);border-radius:calc(var(--u)*1.2);border:2px solid var(--ink);font-weight:800;font-size:calc(var(--u)*1.9);cursor:pointer;background:linear-gradient(#fffaf2,#f4e4c4);color:var(--ink);box-shadow:0 2px 0 #1a100866}
.sb button.red{background:linear-gradient(#ea6a52,#c8462e);color:#fff}
.sb button.grn{background:linear-gradient(#5cb356,#3b8a40);color:#fff}
.sb button:active{transform:translateY(2px);box-shadow:none}
#setbtn{position:absolute;top:calc(var(--u)*10.4);right:calc(var(--u)*1.1);z-index:4;width:calc(var(--u)*3.8);height:calc(var(--u)*3.8);padding:0;border-radius:50%;border:2px solid var(--ink);background:linear-gradient(#fffaf2,#f4e4c4);box-shadow:0 2px 0 #1a100866;cursor:pointer;opacity:.88;display:flex;align-items:center;justify-content:center}
#setbtn svg{width:62%;height:62%}
#setbtn:active{transform:translateY(2px);box-shadow:none}`;
document.head.appendChild(css);
const el=(html)=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild};

// ---- hình nền màn hình đầu: vẽ bằng bộ dựng cảnh quan của game (384×216 rồi phóng to) ----
const art=mkBg(b=>{
 A.sky(b,384,124);A.sun(b,312,42,14);
 A.cloud(b,24,26,1.3);A.cloud(b,150,52,.9);A.cloud(b,232,16,1.1);A.cloud(b,330,76,.8);
 A.hills(b,0,68,384,50,'#a6c4d8',1);A.hills(b,0,84,384,40,'#86b4a2',2);A.hills(b,0,98,384,30,'#6aa86a',3);
 grass(b,112);
 rr(b,0,176,384,24,'#c49a60');for(let x=0;x<384;x+=3)rr(b,x,176+hs(x,1)%3,3,1,'#d8b078');for(let i=0;i<60;i++)rr(b,hs(i,2)%384,180+hs(i,3)%18,2,1,'#a8803e');rr(b,0,176,384,1,'#8a5a30');
 A.tree(b,18,120,'#4a9a3c');A.tree(b,350,126,'#5fb04a');A.tree(b,90,112,'#5fb04a');
 A.hut(b,32,104,52,'#e8c888','#c89a4a');A.hut(b,282,100,58,'#c8e0a8','#c89a4a');
 [['rau_muong',4],['ca_chua',4],['chanh',4],['ca_rot',3]].forEach(([k,st],i)=>{const x=10+i*28,y=154;rr(b,x,y,24,24,'#3a2a1c');rr(b,x+1,y+1,22,22,'#5a3a20');const sp=G.plantSprite(k,st);b.drawImage(sp,x+12-sp.width/2,y+23-sp.height)});
 [[128,150],[256,132],[60,196],[320,164]].forEach(([x,y],i)=>A.bush(b,x,y,i%2?'#5fb04a':'#4a9a3c'));
 for(let i=0;i<22;i++)A.flower(b,hs(i,7)%380,118+hs(i,8)%90,['#f2d04a','#f6b0c0','#fff','#b8a0e8'][i%4]);
 A.lantern(b,98,120,'#f2a82a');
},384,216);

const prog=()=>{const S=G.S;return S.day>1||S.served>0||S.plotsOpen>10||S.tier>0||S.money!==80||(S.stat&&S.stat.plant>0)||S.plots.some(Boolean)};
const sum=()=>{const S=G.S;return `Ngày ${S.day} · ${S.money} xu`};

const title=el(`<div id="title"><div class="box"><h1>Xóm Chanh</h1><div class="sub">Trồng trọt · Nấu ăn · Bán hàng rong</div>
 <button class="tb go" data-a="go">Chơi tiếp<small></small></button>
 <button class="tb new" data-a="new">Chơi lại<small>Bắt đầu một ván mới</small></button>
 <button class="tb cfg" data-a="cfg">Cài đặt</button></div></div>`);
title.insertBefore(art,title.firstChild);
const goBtn=title.querySelector('[data-a=go]');
const refreshTitle=()=>{const p=prog();goBtn.disabled=!p;goBtn.querySelector('small').textContent=p?sum():'Chưa có ván nào được lưu'};

// ---- bảng cài đặt ----
const set=el(`<div id="set"><div class="sc"><h2>Cài đặt</h2>
 <div class="sr"><span class="sl">Nhạc nền</span><input type="range" min="0" max="100" data-v="mVol"><button class="sw" data-t="mOn"></button></div>
 <div class="sr"><span class="sl">Hiệu ứng</span><input type="range" min="0" max="100" data-v="sVol"><button class="sw" data-t="sOn"></button></div>
 <div class="sb"><button data-a="home">Màn hình chính</button><button class="red" data-a="new">Chơi lại</button><button class="grn" data-a="close">Đóng</button></div></div></div>`);
const cf=el(`<div id="cf"><div class="sc"><h2>Chơi lại từ đầu?</h2><p>Toàn bộ tiến trình hiện tại (tiền, ruộng, công thức, quán…) sẽ bị xoá và không lấy lại được.</p>
 <div class="sb"><button data-a="no">Giữ ván này</button><button class="red" data-a="yes">Xoá và chơi lại</button></div></div></div>`);
const cfg=()=>G.audio.cfg;
const syncSet=()=>{set.querySelectorAll('[data-v]').forEach(i=>{i.value=Math.round(cfg()[i.dataset.v]*100)});
 set.querySelectorAll('[data-t]').forEach(b=>{const on=cfg()[b.dataset.t];b.textContent=on?'Bật':'Tắt';b.classList.toggle('off',!on)})};
set.addEventListener('input',e=>{const i=e.target.closest('[data-v]');if(!i)return;G.audio.ensure();cfg()[i.dataset.v]=i.value/100;G.audio.apply()});
set.addEventListener('change',e=>{if(e.target.closest('[data-v]'))G.audio.save()});
const openSet=()=>{syncSet();set.style.display='flex'};
const closeSet=()=>{set.style.display='none'};

// ---- hành động ----
const hideTitle=()=>{title.classList.add('out');G.paused=false;setTimeout(()=>{title.style.display='none'},500)};
const showTitle=()=>{closeSet();refreshTitle();title.style.display='flex';void title.offsetWidth;title.classList.remove('out');G.paused=true};
const resetAll=()=>{G.save=()=>{};try{localStorage.removeItem(G.KEY)}catch(e){}try{sessionStorage.setItem(SKIP,'1')}catch(e){}location.reload()};
const askNew=()=>{if(!prog()){hideTitle();closeSet();return}cf.style.display='flex'};
const act=a=>{G.audio.ensure();
 if(a==='go'&&prog())hideTitle();
 else if(a==='new')askNew();
 else if(a==='cfg')openSet();
 else if(a==='close')closeSet();
 else if(a==='home')showTitle();
 else if(a==='yes')resetAll();
 else if(a==='no')cf.style.display='none'};
[title,set,cf].forEach(root=>root.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){G.audio.ensure();cfg()[t.dataset.t]=!cfg()[t.dataset.t];G.audio.apply();G.audio.save();syncSet();return}
 const b=e.target.closest('[data-a]');if(b)act(b.dataset.a);else if(root!==title&&e.target===root)root.style.display='none'}));

// ---- nút bánh răng ----
const gear=el(`<button id="setbtn" type="button" title="Cài đặt" aria-label="Cài đặt"><svg viewBox="0 0 24 24" fill="none" stroke="#2a1a10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>`);
gear.addEventListener('click',()=>{G.audio.ensure();openSet()});

game.appendChild(gear);game.appendChild(title);game.appendChild(set);game.appendChild(cf);
let skip=false;try{skip=sessionStorage.getItem(SKIP)==='1';sessionStorage.removeItem(SKIP)}catch(e){}
if(skip){title.style.display='none'}else{refreshTitle();G.paused=true}
})();


</script>
