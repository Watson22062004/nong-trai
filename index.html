<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b140f">
<title>Tiệm Xôi Bến Dừa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Giao diện 16:9. Cỡ chữ/nút theo --u (1% chiều rộng khung game) */
:root{
  --ink:#2a1a10;--paper:#fff6e4;--paper2:#f3e2c0;--leaf:#3f8f45;--leafd:#245c2c;
  --clay:#c8462e;--gold:#f0b429;--goldd:#b8841c;--wood:#6b4423;--cream:#fffaf2;
  --shadow:0 3px 0 #1a100888,0 8px 18px #0004;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:
  radial-gradient(1200px 500px at 50% 0%,#1d3a28 0%,#0b140f 55%,#07100c 100%);
  overflow:hidden;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);touch-action:manipulation}
body{display:grid;place-items:center}
#game{
  --u:calc(min(100vw,100vh*16/9)/100);
  position:relative;width:calc(var(--u)*100);height:calc(var(--u)*56.25);
  min-width:320px;min-height:180px;font-size:calc(var(--u)*1.9);
  background:#16301c;border-radius:calc(var(--u)*1.4);overflow:hidden;
  box-shadow:0 0 0 3px #3a2412,0 0 0 6px #e8d7b0,0 18px 40px #000a;
}
@supports(height:100dvh){#game{--u:calc(min(100vw,100dvh*16/9)/100)}}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated}
.ic{width:calc(var(--u)*3);height:calc(var(--u)*3);image-rendering:pixelated;vertical-align:middle;flex:none}
[data-ic]{display:inline-flex}
#hud{
  position:absolute;top:calc(var(--u)*1.1);left:calc(var(--u)*1.1);right:calc(var(--u)*1.1);
  display:flex;gap:calc(var(--u)*.6);pointer-events:none;align-items:flex-start;z-index:2;
}
#hud .left{display:flex;gap:calc(var(--u)*.5);align-items:center;flex-wrap:wrap}
.stat{
  display:inline-flex;align-items:center;gap:calc(var(--u)*.35);
  background:linear-gradient(#fffaf2,#f4e4c4);
  border:2px solid var(--ink);border-radius:999px;
  box-shadow:0 2px 0 #1a100866;
  padding:calc(var(--u)*.28) calc(var(--u)*.9) calc(var(--u)*.28) calc(var(--u)*.4);
  font-weight:800;color:var(--ink);font-size:calc(var(--u)*1.7);line-height:1;
}
.stat .ic{width:calc(var(--u)*2.5);height:calc(var(--u)*2.5)}
.stat b{font-weight:800}
.zonepill{
  margin-left:auto;display:inline-flex;align-items:center;gap:calc(var(--u)*.4);
  background:#2a1a10e8;color:#fff6e4;border:2px solid #f0b429;
  border-radius:999px;padding:calc(var(--u)*.35) calc(var(--u)*1.1);
  font-weight:800;font-size:calc(var(--u)*1.55);letter-spacing:.02em;
  box-shadow:0 2px 0 #0008;
}
#bagbtn{
  position:static;flex:0 0 auto;pointer-events:auto;
  width:calc(var(--u)*6.6);height:calc(var(--u)*6.6);
  min-width:calc(var(--u)*6.6);padding:0;margin:0 0 0 calc(var(--u)*.4);
  display:flex;align-items:center;justify-content:center;
  border-radius:calc(var(--u)*1.4);
  background:linear-gradient(#5cb356,#3b8a40);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--leafd);
  color:#fff;
}
#bagbtn .ic{width:calc(var(--u)*3.6);height:calc(var(--u)*3.6)}
#bagbtn:active{transform:translateY(2px);box-shadow:none}
.chip{display:flex;align-items:center;gap:calc(var(--u)*.6);background:var(--paper);border:2px solid var(--ink);box-shadow:0 2px 0 #0006;padding:calc(var(--u)*.4) calc(var(--u)*1);font:600 calc(var(--u)*1.9) "Be Vietnam Pro",sans-serif;color:var(--ink);cursor:pointer;position:relative}
.bd{position:absolute;top:calc(var(--u)*-.55);right:calc(var(--u)*-.55);background:var(--clay);color:#fff;border:2px solid var(--ink);border-radius:99px;min-width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);line-height:calc(var(--u)*2);text-align:center;font-size:calc(var(--u)*1.35);font-weight:800;padding:0 4px}
.bd:empty{display:none}
#bar{
  position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;
  padding:calc(var(--u)*.7) calc(var(--u)*1) calc(var(--u)*.85);
  background:linear-gradient(transparent,rgba(12,22,14,.55) 40%,rgba(12,22,14,.72));
  pointer-events:none;z-index:6;
}
#tray{
  display:flex;align-items:flex-end;gap:calc(var(--u)*.35);
  pointer-events:auto;
  background:linear-gradient(#8a5a34,#5c3a22);
  border:2px solid #2a1a10;border-bottom-width:3px;border-radius:calc(var(--u)*1.5);
  padding:calc(var(--u)*.4) calc(var(--u)*.5) calc(var(--u)*.45);
  box-shadow:0 4px 0 #2a160c,0 10px 18px #0005;
}
#tool{display:flex;gap:calc(var(--u)*.35);pointer-events:auto;justify-content:center;align-items:center}
#tool .chip{
  position:relative;
  width:calc(var(--u)*6.2);height:calc(var(--u)*6.2);
  min-width:calc(var(--u)*6.2);max-width:calc(var(--u)*6.2);
  padding:calc(var(--u)*.15);margin:0;box-sizing:border-box;
  font-size:calc(var(--u)*1.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;flex:0 0 auto;white-space:nowrap;
  border-radius:calc(var(--u)*1.05);
  background:linear-gradient(#fffaf2,#efe0c2);
  border:2px solid #3a2412;
  box-shadow:inset 0 1px 0 #fff8,0 2px 0 #3a241288;
}
#tool .chip .ic{width:calc(var(--u)*2.7);height:calc(var(--u)*2.7);flex:none}
#tool .chip .slotn{position:absolute;top:2px;left:4px;font-size:calc(var(--u)*1);opacity:.55;font-weight:800;line-height:1;color:#6b4423}
#tool .chip .qty{position:absolute;right:3px;bottom:1px;font-size:calc(var(--u)*1.15);line-height:1;font-weight:800;color:#2a1a10;text-shadow:0 1px 0 #fff8}
#tool .chip.empty{opacity:1;background:repeating-linear-gradient(135deg,#d8c49a 0 6px,#cbb58a 6px 12px);box-shadow:inset 0 0 0 1px #0002}
#tool .chip.empty .slotn{opacity:.7}
#tool .chip.sel{
  background:linear-gradient(#ffe9a8,#f0b429);color:#2a1a10;opacity:1;
  border-color:#2a1a10;
  box-shadow:0 0 0 2px #fff6,0 3px 0 #8a6414;
  transform:translateY(calc(var(--u)*-.25));
}
#tool .chip.sel .ic{opacity:1;filter:none}
#tool .chip.sel .slotn{opacity:1;color:#6b3a10}
#nav{display:none}
#toast{
  position:absolute;top:calc(var(--u)*6.2);left:50%;transform:translateX(-50%);
  max-width:72%;background:#2a1a10ee;color:#ffe7a8;
  border:2px solid #f0b429;border-radius:999px;
  padding:calc(var(--u)*.45) calc(var(--u)*1.6);
  font-weight:700;text-align:center;z-index:3;
  box-shadow:0 4px 0 #0006;
}
#toast:empty{display:none}
#modal{
  display:none;position:absolute;
  inset:calc(var(--u)*4.2) calc(var(--u)*12);
  background:var(--paper);border:3px solid var(--ink);
  border-radius:calc(var(--u)*1.4);
  box-shadow:0 10px 0 #1a100866,0 18px 30px #0006;
  flex-direction:column;z-index:5;overflow:hidden;
}
#mh{
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(var(--u)*.7) calc(var(--u)*1.2);
  border-bottom:3px solid var(--ink);
  background:linear-gradient(#f7e7c4,#e7d2a4);
  font-weight:800;font-size:calc(var(--u)*2.3);
}
#mh .btn{box-shadow:0 2px 0 #8a2d1c}
#mbody{padding:calc(var(--u)*1) calc(var(--u)*1.2);overflow:auto;flex:1;background:linear-gradient(#fffaf2,#f7edd8)}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*.8);
  padding:calc(var(--u)*.7) calc(var(--u)*.8);margin-bottom:calc(var(--u)*.6);
  background:#fffaf2;border:2px solid #3a2412;border-radius:calc(var(--u)*.9);
  box-shadow:0 2px 0 #3a241222;
}
.row .name{display:flex;align-items:center;gap:calc(var(--u)*.7);flex:1;min-width:0}
.row small,.hint{display:block;font-size:calc(var(--u)*1.45);color:#7a5a40;font-weight:500}
.ing{display:flex;gap:calc(var(--u)*.7);margin-top:2px;font-size:calc(var(--u)*1.45)}
.ing span{display:inline-flex;align-items:center;background:#f3e6cc;border-radius:999px;padding:0 calc(var(--u)*.4)}
.ing .ic{width:calc(var(--u)*2.1);height:calc(var(--u)*2.1)}
.lack{color:var(--clay);font-weight:700;background:#fde4dc}
h3{margin:calc(var(--u)*1) 0 calc(var(--u)*.6);color:var(--leafd);font-size:calc(var(--u)*2)}
.btn{
  font:700 calc(var(--u)*1.7) "Be Vietnam Pro",sans-serif;color:#fff;
  background:linear-gradient(#5cb356,#3b8a40);
  border:2px solid var(--ink);border-radius:calc(var(--u)*.7);
  box-shadow:0 3px 0 var(--leafd);
  padding:calc(var(--u)*.4) calc(var(--u)*1);
  cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:calc(var(--u)*.4);
}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.gold{background:linear-gradient(#ffe08a,#f0b429);color:var(--ink);box-shadow:0 3px 0 var(--goldd)}
.btn.red{background:linear-gradient(#e26852,#c8462e);box-shadow:0 3px 0 #8a2d1c}
.btn .ic{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2)}
.bar{height:calc(var(--u)*1.3);flex:1;min-width:calc(var(--u)*6);background:#efe0c2;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6dbd5e,#3f8f45)}
.bar.warn i{background:linear-gradient(90deg,#e26852,#c8462e)}
b.n{font-weight:800}.empty{color:#7a5a40;text-align:center;padding:calc(var(--u)*1)}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#0b140f;color:#ffe7a8;align-items:center;justify-content:center;text-align:center;font-size:18px;padding:28px;line-height:1.6;font-weight:700}
@media(orientation:portrait){#rot{display:flex}}

/* ===== Túi đồ dạng lưới (pixel) ===== */
#game{--n:calc(var(--u)*.4)}
#modal.bagmode{inset:calc(var(--u)*3.4) calc(var(--u)*5) calc(var(--u)*10.4) calc(var(--u)*5);padding:calc(var(--u)*.7);
  background:repeating-linear-gradient(0deg,#7a4e2a 0 calc(var(--u)*1.2),#6b4423 calc(var(--u)*1.2) calc(var(--u)*2.4));
  border:3px solid #2a1a10;border-radius:calc(var(--u)*.6);
  box-shadow:inset 0 0 0 calc(var(--u)*.3) #a8733a,inset 0 0 0 calc(var(--u)*.5) #3a2412,0 6px 0 #1a1008aa,0 14px 24px #0007}
#modal.bagmode #mh{background:#4a2c16;color:#ffe7a8;border:0;border-bottom:3px solid #2a1a10;padding:calc(var(--u)*.4) calc(var(--u)*1);font-size:calc(var(--u)*2.1)}
#modal.bagmode #mbody{background:#3a2412;padding:calc(var(--u)*.8);overflow:hidden;display:flex}
.bag{display:flex;gap:calc(var(--u)*.8);width:100%;min-height:0}
.bgrid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:calc(var(--u)*.45);align-content:start;overflow:auto;padding:2px}
.cell{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;border:0;padding:0;margin:0;cursor:pointer;
  background:#d8c49a;box-shadow:inset 0 0 0 2px #2a1a10,inset 3px 3px 0 3px #efe0c2,inset -3px -3px 0 3px #b79c68;
  clip-path:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)))}
.cell .ic{width:calc(var(--u)*3.8);height:calc(var(--u)*3.8)}
.cell.void{cursor:default;background:#a68f62;box-shadow:inset 0 0 0 2px #2a1a10,inset 3px 3px 0 3px #8f7a50,inset -3px -3px 0 3px #bba577}
.cell.held{box-shadow:inset 0 0 0 2px #2a1a10,inset 0 0 0 5px #3ba56e}
.cell.on{background:#ffe9a8;box-shadow:inset 0 0 0 2px #2a1a10,inset 0 0 0 5px #f0b429}
.cell .q{position:absolute;right:calc(var(--u)*.55);bottom:calc(var(--u)*.3);font-size:calc(var(--u)*1.35);font-weight:800;color:#2a1a10;text-shadow:0 1px 0 #fff9}
.cell .hk{position:absolute;left:calc(var(--u)*.55);top:calc(var(--u)*.5);font-size:calc(var(--u)*1.1);font-weight:800;background:#2a1a10;color:#ffe7a8;min-width:calc(var(--u)*1.7);line-height:calc(var(--u)*1.7);text-align:center}
.side{width:calc(var(--u)*21);flex:none;display:flex;flex-direction:column;gap:calc(var(--u)*.5);overflow:auto;background:#f3e2c0;padding:calc(var(--u)*.9);
  box-shadow:inset 0 0 0 2px #2a1a10,inset 0 0 0 4px #d8c49a;
  clip-path:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)))}
.side .big{text-align:center}.side .big .ic{width:calc(var(--u)*5.5);height:calc(var(--u)*5.5)}
.side .nm{text-align:center;font-size:calc(var(--u)*2)}.side small{text-align:center}
.side .tip{margin:0}.side .btn{justify-content:center}.side .grow{flex:1}
#tool .chip.dim .ic{opacity:.35}
#tool .chip.tgt{animation:tg .9s steps(2) infinite}
#tool .chip.pick{box-shadow:0 0 0 calc(var(--u)*.3) #3ba56e,0 3px 0 #8a6414}
@keyframes tg{50%{box-shadow:0 0 0 calc(var(--u)*.3) #f0b429,0 2px 0 #3a241288}}
</style></head>
<body>
<div id="game">
 <canvas id="cv" width="384" height="216"></canvas>
 <div id="hud"></div>
 <div id="toast"></div>
 <div id="bar">
  <div id="tray">
   <div id="tool"></div>
   <button class="chip" id="bagbtn" data-modal="bag" title="Túi đồ"><i data-ic="balo"></i><span class="bd" id="readybd"></span></button>
  </div>
 </div>
 <div id="modal"><div id="mh"><span id="mtitle"></span><button class="btn" data-modal="">Đóng</button></div><div id="mbody"></div></div>
</div>

// TRẠNG THÁI + LƯU GAME (localStorage)
G.KEY='xoiBenDua';
G.fresh=()=>({money:G.CFG.startMoney,day:1,clock:0,inv:{hat_nep:5,hat_hanh:3,hat_dau_xanh:2},
  hotbar:Array(8).fill(null),plots:Array(G.CFG.plots).fill(null),animals:[],cooking:[],customers:[],spawn:0,served:0});
G.S=(()=>{try{return JSON.parse(localStorage[G.KEY])}catch(e){return G.fresh()}})();
if(!Array.isArray(G.S.hotbar))G.S.hotbar=Array(8).fill(null);
while(G.S.plots.length<G.CFG.plots)G.S.plots.push(null);
if(G.S.plots.length>G.CFG.plots)G.S.plots=G.S.plots.slice(0,G.CFG.plots); // migrate if reduced
G.ui={zone:'farm',seed:'nep',held:null,modal:null,sel:null,hotbar:G.S.hotbar};
// Trang bị nhanh 8 ô (Stardew-style)
G.hold=id=>{
  if(!id){G.ui.held=null;return}
  // Bấm lại ô đang chọn → bỏ tay (chỉ 1 ô được chọn)
  if(G.ui.held===id){G.ui.held=null;G.msg('Bỏ tay');return}
  if(!G.has(id)&&!id.startsWith('hat_')){G.ui.held=null;return}
  G.ui.held=id;
  if(id.startsWith('hat_'))G.ui.seed=id.slice(4);
  G.msg('Đang cầm: '+(G.ITEMS[id]?.n||id));
};
G.unhold=()=>{G.ui.held=null};
// Gắn vật phẩm vào ô nhanh i. Nếu vật phẩm đang ở ô khác thì 2 ô hoán đổi; ô đích có đồ khác thì đồ đó rời thanh nhanh (vẫn còn trong túi).
G.putHot=(i,id)=>{const hb=G.ui.hotbar,j=hb.indexOf(id),old=hb[i];
  if(j===i){G.msg('Đã ở ô '+(i+1));return}
  if(j>=0){hb[j]=old;hb[i]=id;G.msg(old?`Hoán đổi ô ${j+1} ↔ ô ${i+1}`:`Chuyển sang ô ${i+1}`)}
  else{hb[i]=id;G.msg(`Gắn ô ${i+1}: ${G.ITEMS[id]?.n||id}`)}};
G.setHot=i=>{const id=G.ui.hotbar[i];if(id)G.hold(id);else G.unhold()};
// Tự xếp vật phẩm vào hotbar khi nhặt (ô trống)
G.fillHot=()=>{
  const hb=G.ui.hotbar;
  Object.keys(G.S.inv).forEach(id=>{
    if(hb.includes(id))return;
    const empty=hb.findIndex(x=>!x);
    if(empty>=0)hb[empty]=id;
  });
};
G.save=()=>{try{localStorage[G.KEY]=JSON.stringify(G.S)}catch(e){}};
G.reset=()=>{G.S=G.fresh();G.ui.hotbar=G.S.hotbar;G.ui.held=null;G.ui.sel=null;G.save()};
G.has=(id,n=1)=>(G.S.inv[id]||0)>=n;
G.add=(id,n=1)=>{G.S.inv[id]=(G.S.inv[id]||0)+n;if(G.S.inv[id]<=0)delete G.S.inv[id]};

// TRỒNG TRỌT + CHĂN NUÔI
G.plotClick=i=>{const p=G.S.plots[i],k=G.ui.seed;
  if(!p){ if(!G.has('hat_'+k))return G.msg('Hết hạt '+G.CROPS[k].n+' — ra Chợ mua nhé');
    G.add('hat_'+k,-1);G.S.plots[i]={crop:k,t:0};}
  else if(p.t>=G.CROPS[p.crop].time){G.add(p.crop,1+(Math.random()<.3?1:0));G.S.plots[i]=null;}};
G.buyAnimal=t=>{const a=G.ANIMALS[t];
  if(G.S.animals.length>=G.CFG.maxAnimals)return G.msg('Chuồng đã đầy');
  if(G.S.money<a.cost)return G.msg('Không đủ tiền');
  G.S.money-=a.cost;G.S.animals.push({type:t,fed:false,t:0,ready:false});};
G.feed=i=>{const a=G.S.animals[i];if(a.fed||a.ready)return;
  if(!G.has('cam'))return G.msg('Hết cám — ra Chợ mua nhé');G.add('cam',-1);a.fed=true;a.t=0;};
G.collect=i=>{const a=G.S.animals[i];if(!a.ready)return;
  G.add(G.ANIMALS[a.type].make);a.ready=false;a.fed=false;a.t=0;};
G.updateFarm=dt=>{
  G.S.plots.forEach(p=>{if(p)p.t=Math.min(p.t+dt,G.CROPS[p.crop].time)});
  G.S.animals.forEach(a=>{if(a.fed&&!a.ready){a.t+=dt;if(a.t>=G.ANIMALS[a.type].time)a.ready=true}});};

// MUA / BÁN
G.buy=id=>{const p=G.ITEMS[id].buy;if(G.S.money<p)return G.msg('Không đủ tiền');G.S.money-=p;G.add(id)};
G.sell=(id,all)=>{const n=all?G.S.inv[id]:1;if(!G.has(id))return;G.S.money+=G.ITEMS[id].sell*n;G.add(id,-n)};
G.msgText='';G.msg=t=>{G.msgText=t;clearTimeout(G._m);G._m=setTimeout(()=>G.msgText='',2500)};

// NẤU ĂN + KHÁCH HÀNG
G.canCook=r=>Object.entries(G.RECIPES[r].need).every(([k,n])=>G.has(k,n));
G.cook=r=>{if(!G.canCook(r))return G.msg('Thiếu nguyên liệu');if(G.S.cooking.length>=3)return G.msg('Bếp đang bận (tối đa 3 mẻ)');
  for(const[k,n]of Object.entries(G.RECIPES[r].need))G.add(k,-n);G.S.cooking.push({r,t:0})};
G.serve=i=>{const c=G.S.customers[i],r=G.RECIPES[c.want];
  if(!G.has(c.want))return G.msg('Chưa có '+r.n);
  const tip=c.p/G.CFG.patience>.5?1.2:1; // khách còn kiên nhẫn → boa
  G.add(c.want,-1);G.S.money+=Math.round(r.price*tip);G.S.customers.splice(i,1);G.S.served++};
G.updateKitchen=dt=>{const S=G.S,q=S.cooking[0];
  if(q){q.t+=dt;if(q.t>=G.RECIPES[q.r].time){G.add(q.r);S.cooking.shift()}}
  S.spawn+=dt;
  if(S.spawn>=G.CFG.customerEvery&&S.customers.length<G.CFG.maxCustomers){S.spawn=0;
    const ks=Object.keys(G.RECIPES);S.customers.push({want:ks[Math.random()*ks.length|0],p:G.CFG.patience})}
  S.customers.forEach(c=>c.p-=dt);S.customers=S.customers.filter(c=>c.p>0);
  S.clock+=dt;if(S.clock>=120){S.clock=0;S.day++}};

// GIAO DIỆN HTML (HUD, thanh chọn khu, bảng mua/bán/nấu) + VÒNG LẶP
const $=s=>document.querySelector(s);
const L=(id,n)=>`<span class="name">${G.ic(id)}<span>${G.ITEMS[id].n}${n!=null?` <b class="n">×${n}</b>`:''}</span></span>`;
const bar=(v,m,w)=>`<div class="bar ${w?'warn':''}"><i style="width:${Math.min(100,v/m*100)}%"></i></div>`;
const B=(a,id,t,c='')=>`<button class="btn ${c}" data-act="${a}" data-id="${id}">${t}</button>`;
const price=p=>`${G.ic('coin')}${p}`;
const need=r=>`<div class="ing">${Object.entries(G.RECIPES[r].need).map(([k,n])=>`<span class="${G.has(k,n)?'':'lack'}">${G.ic(k)}×${n}</span>`).join('')}</div>`;
const buyList=ids=>ids.map(k=>`<div class="row">${L(k,G.S.inv[k]||0)}${B('buy',k,price(G.ITEMS[k].buy),'gold')}</div>`).join('');
const TITLE={seeds:'Hạt giống',ing:'Nguyên liệu',animals:'Vật nuôi',sell:'Thu mua',cook:'Bếp',bag:'Túi đồ'};
const M={
 seeds:()=>buyList(Object.keys(G.CROPS).map(k=>'hat_'+k)),
 ing:()=>buyList(['cam','duong','muoi']),
 animals:()=>Object.keys(G.ANIMALS).map(k=>{const a=G.ANIMALS[k];return `<div class="row"><span class="name">${G.ic(k)}<span>${a.n}<small>${a.time} giây ra ${G.ITEMS[a.make].n.toLowerCase()}</small></span></span>${B('animal',k,price(a.cost),'gold')}</div>`}).join('')+`<p class="hint">Đang nuôi ${G.S.animals.length}/${G.CFG.maxAnimals}</p>`,
 sell:()=>{const inv=Object.entries(G.S.inv);return inv.length?inv.map(([k,n])=>`<div class="row">${L(k,n)}<span>${B('sell',k,'Bán 1 · '+price(G.ITEMS[k].sell),'gold')} ${B('sellall',k,'Bán hết')}</span></div>`).join(''):'<p class="empty">Kho trống, đi thu hoạch trước đã.</p>'},
 cook:()=>{const S=G.S;let h='';S.cooking.forEach((q,i)=>h+=`<div class="row">${L(q.r)}${i?'<small>Đang chờ</small>':bar(q.t,G.RECIPES[q.r].time)}</div>`);
  if(h)h='<h3>Đang nấu</h3>'+h+'<h3>Công thức</h3>';
  for(const k in G.RECIPES){const r=G.RECIPES[k];h+=`<div class="row"><span><span class="name">${G.ic(k)}<span>${r.n}<small>Bán ${r.price} đồng · ${r.time} giây</small></span></span>${need(k)}</span>${B('cook',k,'Nấu',G.canCook(k)?'':'red')}</div>`}return h},
 bag:()=>{const ks=Object.keys(G.ITEMS),inv=Object.entries(G.S.inv).sort((a,b)=>ks.indexOf(a[0])-ks.indexOf(b[0])),
  sel=G.ui.sel&&G.S.inv[G.ui.sel]?G.ui.sel:(G.ui.sel=null),hb=G.ui.hotbar,total=Math.max(24,Math.ceil(inv.length/6)*6);
  let cells='';
  for(let i=0;i<total;i++){const e=inv[i];if(!e){cells+='<div class="cell void"></div>';continue}
   const[k,n]=e,h=hb.indexOf(k);
   cells+=`<button class="cell ${sel===k?'on':''} ${G.ui.held===k?'held':''}" data-act="sel" data-id="${k}">${G.ic(k)}<span class="q">${n}</span>${h>=0?`<span class="hk">${h+1}</span>`:''}</button>`}
  let side;
  if(sel){const it=G.ITEMS[sel],h=hb.indexOf(sel);
   side=`<div class="big">${G.ic(sel)}</div><b class="nm">${it.n}</b><small>Có ${G.S.inv[sel]} · ${h>=0?'Đang ở ô '+(h+1):'Chưa gắn ô nhanh'}</small>`+
    (it.sell!=null?`<small>Giá bán ${price(it.sell)}</small>`:'')+
    `<p class="hint tip">Bấm một ô nhanh bên dưới để gắn. Ô đã có đồ sẽ hoán đổi.</p>`+
    B('hold',sel,G.ui.held===sel?'Bỏ tay':'Cầm')+(h>=0?B('unslot',sel,'Gỡ khỏi ô '+(h+1),'red'):'')+
    (it.sell!=null?B('sell',sel,'Bán 1 · '+price(it.sell),'gold')+B('sellall',sel,'Bán hết','gold'):'')}
  else side=`<p class="hint tip">${inv.length?'Thanh ô nhanh đang trống: chọn một vật phẩm trong túi rồi bấm vào ô nhanh bên dưới để gắn tuỳ ý. Ô đã có đồ sẽ hoán đổi vị trí.':'Túi trống, ra ruộng thu hoạch trước đã.'}</p>`+

  side+=`<span class="grow"></span>`;
  return `<div class="bag"><div class="bgrid">${cells}</div><div class="side">${side}</div></div>`}

const acts={seed:id=>{G.ui.seed=id;G.hold('hat_'+id)},hold:id=>G.hold(id),unhold:()=>G.unhold(),sel:id=>{G.ui.sel=G.ui.sel===id?null:id},unslot:id=>{const hb=G.ui.hotbar,i=hb.indexOf(id);if(i>=0){hb[i]=null;G.msg('Gỡ khỏi ô '+(i+1))}},

 }).join('');
