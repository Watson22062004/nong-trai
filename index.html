<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b140f">
<title>Tiệm Xôi Bến Dừa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Giao diện toàn màn hình 16:9. Mọi cỡ chữ/nút tính theo --u (1% chiều rộng khung game) */
:root{--ink:#2a1a10;--paper:#f6ecd2;--paper2:#e9d8ad;--leaf:#4f9a45;--leafd:#2f6a2e;--clay:#c8462e;--gold:#f2b632}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b140f;overflow:hidden;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);touch-action:manipulation}
body{display:grid;place-items:center}
#game{--u:calc(min(100vw,100vh*16/9)/100);position:relative;width:calc(var(--u)*100);height:calc(var(--u)*56.25);min-width:320px;min-height:180px;font-size:calc(var(--u)*1.9);background:#1a3020}
@supports(height:100dvh){#game{--u:calc(min(100vw,100dvh*16/9)/100)}}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated}
.ic{width:calc(var(--u)*3);height:calc(var(--u)*3);image-rendering:pixelated;vertical-align:middle;flex:none}
[data-ic]{display:inline-flex}
#hud{position:absolute;top:calc(var(--u)*1);left:calc(var(--u)*1);display:flex;gap:calc(var(--u)*.8);pointer-events:none;align-items:center}
#hud .chip{background:transparent!important;border:none!important;box-shadow:none!important;padding:0;font-size:calc(var(--u)*1.8);font-weight:700;text-shadow:0 1px 2px #000c,0 0 3px #0008;color:#fffaf0;gap:calc(var(--u)*.3)}
#bagbtn{
  position:static;flex:0 0 auto;pointer-events:auto;
  width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);
  min-width:calc(var(--u)*6.4);padding:0;margin:0;
  display:flex;align-items:center;justify-content:center;
  box-sizing:border-box
}
#bagbtn .ic{width:calc(var(--u)*4.2);height:calc(var(--u)*4.2)}
.chip{display:flex;align-items:center;gap:calc(var(--u)*.6);background:var(--paper);border:2px solid var(--ink);box-shadow:0 2px 0 #000a;padding:calc(var(--u)*.4) calc(var(--u)*1);font:600 calc(var(--u)*1.9) "Be Vietnam Pro",sans-serif;color:var(--ink);cursor:pointer;position:relative}
.chip.sel,.nb.on{background:var(--gold)}
.bd{position:absolute;top:calc(var(--u)*-1);right:calc(var(--u)*-.8);background:var(--clay);color:#fff;border:2px solid var(--ink);border-radius:99px;min-width:calc(var(--u)*2.6);text-align:center;font-size:calc(var(--u)*1.5);padding:0 4px}
.bd:empty{display:none}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;padding:calc(var(--u)*1);background:linear-gradient(transparent,#0008);pointer-events:none}
#tool{display:flex;gap:calc(var(--u)*.4);pointer-events:auto;justify-content:center;align-items:center}
#tool .chip{
  position:relative;
  width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);
  min-width:calc(var(--u)*6.4);max-width:calc(var(--u)*6.4);
  padding:calc(var(--u)*.15);margin:0;box-sizing:border-box;
  font-size:calc(var(--u)*1.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;flex:0 0 auto;white-space:nowrap
}
#tool .chip .ic{width:calc(var(--u)*2.8);height:calc(var(--u)*2.8);flex:none}
#tool .chip .slotn{position:absolute;top:1px;left:3px;font-size:calc(var(--u)*1.05);opacity:.7;font-weight:700;line-height:1}
#tool .chip .qty{font-size:calc(var(--u)*1.15);line-height:1;font-weight:700}
#tool .chip.empty{opacity:.45;background:var(--paper2)}
#tool .chip.sel{
  background:#1a1208;color:#c9a86a;opacity:1;
  border-color:#f2b632;
  box-shadow:inset 0 0 0 2px #f2b632,0 0 0 2px #2a1a10,0 3px 0 #000a
}
#tool .chip.sel .ic{opacity:.5;filter:brightness(.5)}
#tool .chip.sel .qty{opacity:.45}
#tool .chip.sel .slotn{opacity:1;color:#f2b632;font-weight:800}
#nav{display:none}
#toast{position:absolute;top:calc(var(--u)*5.5);left:50%;transform:translateX(-50%);max-width:70%;background:#2a1a10e0;color:var(--gold);padding:calc(var(--u)*.5) calc(var(--u)*1.5);font-weight:600;text-align:center}
#toast:empty{display:none}
#modal{display:none;position:absolute;inset:calc(var(--u)*3) calc(var(--u)*14);background:var(--paper);border:3px solid var(--ink);box-shadow:0 6px 0 #000a;flex-direction:column;z-index:5}
#mh{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--u)*.8) calc(var(--u)*1.5);border-bottom:3px solid var(--ink);background:var(--paper2);font-weight:800;font-size:calc(var(--u)*2.4)}
#mbody{padding:calc(var(--u)*1.2) calc(var(--u)*1.5);overflow:auto;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*1);padding:calc(var(--u)*.8);margin-bottom:calc(var(--u)*.8);background:#fffaf0;border:2px solid var(--ink)}
.row .name{display:flex;align-items:center;gap:calc(var(--u)*.8);flex:1;min-width:0}
.row small,.hint{display:block;font-size:calc(var(--u)*1.5);color:#7a5a40;font-weight:400}
.ing{display:flex;gap:calc(var(--u)*1);margin-top:2px;font-size:calc(var(--u)*1.5)}
.ing span{display:inline-flex;align-items:center}.ing .ic{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2)}
.lack{color:var(--clay);font-weight:600}
h3{margin:calc(var(--u)*1.2) 0 calc(var(--u)*.8);color:var(--leafd);font-size:calc(var(--u)*2.1)}
.btn{font:600 calc(var(--u)*1.8) "Be Vietnam Pro",sans-serif;color:#fff;background:var(--leaf);border:2px solid var(--ink);box-shadow:0 3px 0 var(--leafd);padding:calc(var(--u)*.5) calc(var(--u)*1.2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:calc(var(--u)*.5)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 #b8841c}
.btn.red{background:var(--clay);box-shadow:0 3px 0 #8a2d1c}
.btn .ic{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4)}
.bar{height:calc(var(--u)*1.2);flex:1;min-width:calc(var(--u)*6);background:var(--paper2);border:2px solid var(--ink)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--leaf) 0 6px,#6dbd5e 6px 8px)}
.bar.warn i{background:var(--clay)}
b.n{font-weight:800}.empty{color:#7a5a40}
#rot{display:none;position:fixed;bottom:16px;left:0;right:0;text-align:center;color:var(--gold);font-weight:600}
@media(orientation:portrait){#rot{display:block}}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#0b140f;color:var(--gold);align-items:center;justify-content:center;text-align:center;font-size:20px;padding:24px;line-height:1.6}
@media(orientation:portrait){#rot{display:flex}}

</style></head>
<body>
<div id="game">
 <canvas id="cv" width="384" height="216"></canvas>
 <div id="hud"></div>
 <div id="toast"></div>
 <div id="bar">
  <div id="tool"></div>
  <button class="chip" id="bagbtn" data-modal="bag" title="Túi đồ"><i data-ic="balo"></i></button>
 </div>
 <div id="modal"><div id="mh"><span id="mtitle"></span><button class="btn" data-modal="">Đóng</button></div><div id="mbody"></div></div>
</div>
<div id="rot">Game chỉ chơi ở chế độ ngang.<br>Hãy xoay ngang điện thoại nhé.</div>

while(G.S.plots.length<G.CFG.plots)G.S.plots.push(null);

G.ui={zone:'farm',seed:'nep',held:null,modal:null,hotbar:['hat_nep','hat_dau_xanh','hat_hanh','hat_dua','cam','trung','sua','muoi']};
// Trang bị nhanh 8 ô (Stardew-style)
G.hold=id=>{
  if(!id){G.ui.held=null;return}
  // Bấm lại ô đang chọn → bỏ tay (chỉ 1 ô được chọn)
  if(G.ui.held===id){G.ui.held=null;G.msg('Bỏ tay');return}
  if(!G.has(id)&&!id.startsWith('hat_')){G.ui.held=null;return}
  G.ui.held=id;
  if(id.startsWith('hat_'))G.ui.seed=id.slice(4);
  G.msg('Đang cầm: '+(G.ITEMS[id]?.n||id));
};
G.unhold=()=>{G.ui.held=null};
G.setHot=i=>{const id=G.ui.hotbar[i];if(id)G.hold(id);else G.unhold()};
// Tự xếp vật phẩm vào hotbar khi nhặt (ô trống)
G.fillHot=()=>{
  const hb=G.ui.hotbar;
  Object.keys(G.S.inv).forEach(id=>{
    if(hb.includes(id))return;
    const empty=hb.findIndex(x=>!x);
    if(empty>=0)hb[empty]=id;
  });
};
G.save=()=>{try{localStorage[G.KEY]=JSON.stringify(G.S)}catch(e){}};
G.reset=()=>{G.S=G.fresh();G.save()};
G.has=(id,n=1)=>(G.S.inv[id]||0)>=n;
G.add=(id,n=1)=>{G.S.inv[id]=(G.S.inv[id]||0)+n;if(G.S.inv[id]<=0)delete G.S.inv[id]};

G.plotClick=i=>{const p=G.S.plots[i],k=G.ui.seed;
  if(!p){ if(!G.has('hat_'+k))return G.msg('Hết hạt '+G.CROPS[k].n+' — ra Chợ mua nhé');
    G.add('hat_'+k,-1);G.S.plots[i]={crop:k,t:0};}
  else if(p.t>=G.CROPS[p.crop].time){G.add(p.crop,1+(Math.random()<.3?1:0));G.S.plots[i]=null;}};
G.buyAnimal=t=>{const a=G.ANIMALS[t];
  if(G.S.animals.length>=G.CFG.maxAnimals)return G.msg('Chuồng đã đầy');
  if(G.S.money<a.cost)return G.msg('Không đủ tiền');
  G.S.money-=a.cost;G.S.animals.push({type:t,fed:false,t:0,ready:false});};
G.feed=i=>{const a=G.S.animals[i];if(a.fed||a.ready)return;
  if(!G.has('cam'))return G.msg('Hết cám — ra Chợ mua nhé');G.add('cam',-1);a.fed=true;a.t=0;};
G.collect=i=>{const a=G.S.animals[i];if(!a.ready)return;
  G.add(G.ANIMALS[a.type].make);a.ready=false;a.fed=false;a.t=0;};
G.updateFarm=dt=>{
  G.S.plots.forEach(p=>{if(p)p.t=Math.min(p.t+dt,G.CROPS[p.crop].time)});
  G.S.animals.forEach(a=>{if(a.fed&&!a.ready){a.t+=dt;if(a.t>=G.ANIMALS[a.type].time)a.ready=true}});};

// MUA / BÁN
G.buy=id=>{const p=G.ITEMS[id].buy;if(G.S.money<p)return G.msg('Không đủ tiền');G.S.money-=p;G.add(id)};
G.sell=(id,all)=>{const n=all?G.S.inv[id]:1;if(!G.has(id))return;G.S.money+=G.ITEMS[id].sell*n;G.add(id,-n)};

G.canCook=r=>Object.entries(G.RECIPES[r].need).every(([k,n])=>G.has(k,n));
G.cook=r=>{if(!G.canCook(r))return G.msg('Thiếu nguyên liệu');if(G.S.cooking.length>=3)return G.msg('Bếp đang bận (tối đa 3 mẻ)');
  for(const[k,n]of Object.entries(G.RECIPES[r].need))G.add(k,-n);G.S.cooking.push({r,t:0})};
G.serve=i=>{const c=G.S.customers[i],r=G.RECIPES[c.want];
  if(!G.has(c.want))return G.msg('Chưa có '+r.n);
  const tip=c.p/G.CFG.patience>.5?1.2:1; // khách còn kiên nhẫn → boa
  G.add(c.want,-1);G.S.money+=Math.round(r.price*tip);G.S.customers.splice(i,1);G.S.served++};
G.updateKitchen=dt=>{const S=G.S,q=S.cooking[0];
  if(q){q.t+=dt;if(q.t>=G.RECIPES[q.r].time){G.add(q.r);S.cooking.shift()}}
  S.spawn+=dt;
  if(S.spawn>=G.CFG.customerEvery&&S.customers.length<G.CFG.maxCustomers){S.spawn=0;
    const ks=Object.keys(G.RECIPES);S.customers.push({want:ks[Math.random()*ks.length|0],p:G.CFG.patience})}
  S.customers.forEach(c=>c.p-=dt);S.customers=S.customers.filter(c=>c.p>0);
  S.clock+=dt;if(S.clock>=120){S.clock=0;S.day++}};

// NHÂN VẬT: chạm đâu đi đó, hoạt ảnh làm việc (cuốc đất, cho ăn, khuấy nồi, bưng món), hạt bụi, chữ bay

G.drawPOI=(x,y,label,zone,sx,sy,big=0)=>{

G.P.go=(x,y,done)=>{

function chr(x,y,dir,st,wa,k,t){
 // TAP anim: sheet 64×64 = 4 cột (frame) × 4 hàng (hướng)
 // Hàng 0=xuống, 1=trái, 2=phải, 3=lên
 const walking=st==='walk';
 const frame=walking?((t/110|0)%4):((t/400|0)%2); // idle cũng nhịp nhẹ 2 frame
 const dirRow={d:0,l:1,r:2,u:3}[dir]??0;
 const img=G.loadImg(walking?G.ASSETS.char1_walk:G.ASSETS.char1_idle);
 // Bóng
 R(x-7,y+1,14,3,'#0005');R(x-5,y+2,10,2,'#0003');
 if(img&&img.complete&&img.naturalWidth>0){
  const sx=frame*16, sy=dirRow*16;
  cx.imageSmoothingEnabled=false;

  cx.drawImage(img,sx,sy,16,16,Math.round(x-16),Math.round(y-30),32,32);
 }else{
  R(x-6,y-28,12,12,'#f5c9a0');R(x-5,y-14,10,10,'#2a3a6e');R(x-4,y-4,3,5,'#1e2a4a');R(x+1,y-4,3,5,'#1e2a4a');
 }
 // Đồ đang cầm trên tay (Stardew-style)
 if(G.ui.held&&st!=='work'){
  const ox=dir==='l'?-14:dir==='r'?10:2, oy=dir==='u'?-18:-10;
  IM(G.ui.held,x+ox,y+oy-8,14);
 }
 // Dụng cụ khi làm việc
 if(st==='work'){
  const hx=x+12,hy=y-14;
  if(wa==='dig'){
    const an=-1.2+Math.sin(k*Math.PI)*2.5;
    for(let i=0;i<11;i++)R(hx+Math.cos(an)*i,hy+Math.sin(an)*i,2,2,'#8b5a2b');
    const ex=hx+Math.cos(an)*11,ey=hy+Math.sin(an)*11;R(ex-2,ey,5,3,'#9a9aa4');
    if(k>.45&&!G.P.fxd){G.P.fxd=1;G.spark(x+8,y,'#6b4423',6,140)}
  }else if(wa==='feed'){R(hx,hy,6,5,'#8b5a2b');R(hx,hy,6,2,'#c08a4c')}
  else if(wa==='stir'){R(hx,hy-6,2,8,'#8b5a2b');R(hx-1,hy-8,5,3,'#c08a4c')}
  else if(wa==='serve'){R(x-8,y-22,16,2,'#8b5a2b');R(x-3,y-26,7,4,'#fffaf0')}
 }
}
G.P.draw=t=>{const p=G.P,dt=Math.min((t-(p.lt||t))/1000,.1);p.lt=t;
 if(p.st==='walk'){const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),s=95*dt;
  if(d<=s){p.x=p.tx;p.y=p.ty;p.st='idle';const f=p.task;p.task=null;f&&f()}
  else{p.x+=dx/d*s;p.y+=dy/d*s;p.dir=Math.abs(dx)>Math.abs(dy)*1.3?(dx<0?'l':'r'):(dy<0?'u':'d')}}
 else if(p.st==='work'){p.wt+=dt;if(p.wt>=p.wd){p.st='idle';p.wfn&&p.wfn();const g=G.S.money-p.ws;if(g>0){G.float('+'+g,p.x,p.y-38,'#f2d04a');G.spark(p.x,p.y-20,'#f2d04a',10,100)}if(G.refreshUI)G.refreshUI()}}
 G.updateCam();
 chr(Math.round(p.x),Math.round(p.y),p.dir,p.st,p.wa,Math.min(1,p.wt/p.wd),t)};
G.fxDraw=t=>{const dt=Math.min((t-(G._ft||t))/1000,.1);G._ft=t;
 G.fx=G.fx.filter(f=>(f.l-=dt)>0);G.fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=f.g*dt;R(f.x,f.y,f.s,f.s,f.c)});
 G.fl=G.fl.filter(f=>(f.l-=dt)>0);G.fl.forEach(f=>{f.y-=18*dt;TS(f.s,f.x,f.y,f.c,10)});

const price=p=>`${G.ic('coin')}${p}`;
const need=r=>`<div class="ing">${Object.entries(G.RECIPES[r].need).map(([k,n])=>`<span class="${G.has(k,n)?'':'lack'}">${G.ic(k)}×${n}</span>`).join('')}</div>`;
const buyList=ids=>ids.map(k=>`<div class="row">${L(k,G.S.inv[k]||0)}${B('buy',k,price(G.ITEMS[k].buy),'gold')}</div>`).join('');
const TITLE={seeds:'Hạt giống',ing:'Nguyên liệu',animals:'Vật nuôi',sell:'Thu mua',cook:'Bếp',bag:'Túi đồ'};
const M={
 seeds:()=>buyList(Object.keys(G.CROPS).map(k=>'hat_'+k)),
 ing:()=>buyList(['cam','duong','muoi']),
 animals:()=>Object.keys(G.ANIMALS).map(k=>{const a=G.ANIMALS[k];return `<div class="row"><span class="name">${G.ic(k)}<span>${a.n}<small>${a.time} giây ra ${G.ITEMS[a.make].n.toLowerCase()}</small></span></span>${B('animal',k,price(a.cost),'gold')}</div>`}).join('')+`<p class="hint">Đang nuôi ${G.S.animals.length}/${G.CFG.maxAnimals}</p>`,
 sell:()=>{const inv=Object.entries(G.S.inv);return inv.length?inv.map(([k,n])=>`<div class="row">${L(k,n)}<span>${B('sell',k,'Bán 1 · '+price(G.ITEMS[k].sell),'gold')} ${B('sellall',k,'Bán hết')}</span></div>`).join(''):'<p class="empty">Kho trống, đi thu hoạch trước đã.</p>'},
 cook:()=>{const S=G.S;let h='';S.cooking.forEach((q,i)=>h+=`<div class="row">${L(q.r)}${i?'<small>Đang chờ</small>':bar(q.t,G.RECIPES[q.r].time)}</div>`);
  if(h)h='<h3>Đang nấu</h3>'+h+'<h3>Công thức</h3>';
  for(const k in G.RECIPES){const r=G.RECIPES[k];h+=`<div class="row"><span><span class="name">${G.ic(k)}<span>${r.n}<small>Bán ${r.price} đồng · ${r.time} giây</small></span></span>${need(k)}</span>${B('cook',k,'Nấu',G.canCook(k)?'':'red')}</div>`}return h},
 bag:()=>{const inv=Object.entries(G.S.inv);
  let h=inv.length?inv.map(([k,n])=>{
    const inHot=G.ui.hotbar.indexOf(k);
    return `<div class="row">${L(k,n)}<span>${B('hold',k,G.ui.held===k?'Đang cầm':'Cầm')} ${B('tohot',k,inHot>=0?'Ô '+(inHot+1):'Gắn ô')} ${G.ITEMS[k]?.sell!=null?B('sell',k,'Bán'):''}</span></div>`;
  }).join(''):'<p class="empty">Túi trống.</p>';
  if(G.ui.held)h=`<p class="hint">Đang cầm: ${G.ic(G.ui.held)} ${G.ITEMS[G.ui.held]?.n||G.ui.held} — ${B('unhold','','Bỏ tay')}</p>`+h;
  h+='<p class="hint">8 ô nhanh phía dưới — bấm Gắn ô để đưa vào thanh trang bị</p>';
  return h+`<p>${B('reset','','Chơi lại từ đầu','red')}</p>`}
};
const acts={seed:id=>{G.ui.seed=id;G.hold('hat_'+id)},hold:id=>G.hold(id),unhold:()=>G.unhold(),sethot:i=>G.setHot(+i),
 tohot:id=>{const hb=G.ui.hotbar;const i=hb.indexOf(id);if(i>=0){hb[i]=null;G.msg('Gỡ khỏi ô '+(i+1));return}
  let e=hb.findIndex(x=>!x);if(e<0)e=0;hb[e]=id;G.msg('Gắn ô '+(e+1)+': '+(G.ITEMS[id]?.n||id));G.hold(id)},
 animal:G.buyAnimal,feed:i=>G.feed(+i),collect:i=>G.collect(+i),buy:G.buy,
 sell:id=>G.sell(id),sellall:id=>G.sell(id,1),cook:id=>{G.cook(id);G.P.work('stir',.6)},serve:i=>G.serve(+i),reset:()=>confirm('Xoá toàn bộ tiến trình?')&&(G.reset(),G.ui.modal=null)};
function ui(){const S=G.S,z=G.ui.zone;
 $('#hud').innerHTML=`<span class="chip">${G.ic('coin')}${S.money}</span><span class="chip">${G.ic('sun')}Ngày ${S.day}</span><span class="chip">${G.ic('face')}${S.served}</span>`;
 $('#toast').textContent=G.msgText;
 // Badge số việc chờ (hiện trên toast nếu cần)
 const ready=S.plots.filter(p=>p&&p.t>=G.CROPS[p.crop].time).length+S.animals.filter(a=>a.ready).length;
 // Thanh 8 ô cùng kích thước — chỉ 1 ô được chọn
 G.fillHot();
 $('#tool').innerHTML=G.ui.hotbar.map((id,i)=>{
   const sel=id&&G.ui.held===id?'sel':'';
   if(!id)return `<button class="chip empty" data-act="sethot" data-id="${i}"><span class="slotn">${i+1}</span></button>`;
   const n=S.inv[id]||0;
   return `<button class="chip ${sel}" data-act="hold" data-id="${id}"><span class="slotn">${i+1}</span>${G.ic(id)}${n?`<span class="qty">×${n}</span>`:''}</button>`;
 }).join('');
 const mo=$('#modal'),mb=$('#mbody'),m=G.ui.modal;
 if(m){const st=mb.scrollTop;$('#mtitle').textContent=TITLE[m];mb.innerHTML=M[m]();mb.scrollTop=st;mo.style.display='flex'}else mo.style.display='none'}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.zone){G.ui.zone=d.zone;G.P.enter(d.zone)}else if(d.modal!==undefined)G.ui.modal=d.modal||null;else if(acts[d.act])acts[d.act](d.id);
 ui();G.save()});
G.refreshUI=()=>{ui();G.save()};
cv.addEventListener('click',e=>{if(G.ui.modal||G.P.st==='work')return;const r=cv.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width,sy=(e.clientY-r.top)*H/r.height;
 const x=sx+G.cam.x,y=sy+G.cam.y; // convert to world coords
 for(let i=G.hot.length-1;i>=0;i--){const h=G.hot[i];if(x>=h.x&&x<h.x+h.w&&y>=h.y&&y<h.y+h.h){G.fxTap(h.sx,h.sy);G.P.act(h);return}}
 G.fxTap(x,y);G.P.go(x,y)});
let last=performance.now(),acc=0;
(function loop(now){const dt=Math.min((now-last)/1000,1);last=now;
 G.updateFarm(dt);G.updateKitchen(dt);G.draw(now);
 acc+=dt;if(acc>.5){acc=0;ui();G.save()}
 requestAnimationFrame(loop)})(last);
G.P.enter(G.ui.zone);G.fillIcons(document);ui();
addEventListener('pointerdown',()=>{if(matchMedia('(pointer:coarse)').matches)try{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e);screen.orientation.lock('landscape').catch(()=>{})}catch(x){}},{once:true});


</script>
</body></html>
